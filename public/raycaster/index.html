<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Raycaster</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  #game-canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #000;
    cursor: crosshair;
  }

  #hud {
    position: fixed;
    top: 10px;
    right: 12px;
    color: rgba(255, 255, 255, 0.6);
    font-size: 12px;
    text-align: right;
    pointer-events: none;
  }

  #lock-hint {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    background: rgba(0, 0, 0, 0.55);
    padding: 14px 20px;
    border-radius: 10px;
    font-size: 14px;
    text-align: center;
    pointer-events: none;
  }

  #controls {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 18px;
    box-sizing: border-box;
    pointer-events: none;
  }

  .pad {
    display: grid;
    grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(2, 52px);
    gap: 6px;
    pointer-events: auto;
  }

  .pad button {
    width: 52px;
    height: 52px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    font-size: 18px;
    -webkit-tap-highlight-color: transparent;
  }

  .pad button:active {
    background: rgba(255, 255, 255, 0.3);
  }

  #move-pad {
    grid-template-areas:
      ".    fwd  ."
      "left back right";
  }
  #btn-forward { grid-area: fwd; }
  #btn-backward { grid-area: back; }
  #btn-strafe-left { grid-area: left; }
  #btn-strafe-right { grid-area: right; }

  #turn-pad {
    grid-template-columns: repeat(2, 52px);
    grid-template-rows: 52px;
  }
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<div id="hud">WASD to move &middot; touch controls below</div>
<div id="lock-hint">Click anywhere to enable mouse look + sound<br />(Esc to release)</div>

<div id="controls">
  <div class="pad" id="move-pad">
    <button id="btn-forward">&#9650;</button>
    <button id="btn-strafe-left">&#9664;</button>
    <button id="btn-backward">&#9660;</button>
    <button id="btn-strafe-right">&#9654;</button>
  </div>

  <div class="pad" id="turn-pad">
    <button id="btn-turn-left">&#8634;</button>
    <button id="btn-turn-right">&#8635;</button>
  </div>
</div>

<!-- Load order matters: each file depends on globals defined by the ones before it. -->
<script src="js/config.js"></script>
<script src="js/textures.js"></script>
<script src="js/audio.js"></script>
<script src="js/player.js"></script>
<script src="js/input.js"></script>
<script src="js/raycaster.js"></script>
<script src="js/renderer.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
