<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Dino Run</title>
<style>
  :root { --bg-1:#0f0c29; --bg-2:#302b63; --bg-3:#24243e; --accent:#7dd3fc; --accent-2:#a78bfa; --card-bg:rgba(255,255,255,0.06); --card-border:rgba(255,255,255,0.14); --text:#eef2ff; --text-dim:#b8c0e0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overscroll-behavior:none; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif; background:linear-gradient(135deg,var(--bg-1),var(--bg-2) 50%,var(--bg-3)); color:var(--text); display:flex; flex-direction:column; align-items:center; padding:18px 14px 24px; min-height:100%; user-select:none; }
  h1 { font-size:clamp(24px,6vw,32px); margin:0 0 12px; background:linear-gradient(90deg,#fff,var(--accent) 60%,var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hud { display:flex; gap:24px; margin-bottom:12px; }
  .hud .panel { background:var(--card-bg); border:1px solid var(--card-border); border-radius:12px; padding:8px 18px; text-align:center; }
  .hud .label { font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); }
  .hud .value { font-size:20px; font-weight:700; color:var(--accent); }
  .board-wrap { position:relative; background:var(--card-bg); border:1px solid var(--card-border); border-radius:16px; padding:8px; touch-action:none; }
  canvas#board { display:block; border-radius:8px; background:rgba(0,0,0,0.35); }
  .overlay { position:absolute; inset:8px; background:rgba(10,8,30,0.85); border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:16px; }
  .overlay.hide { display:none; }
  .overlay h2 { margin:0; font-size:22px; color:var(--accent); }
  .overlay p { margin:0; color:var(--text-dim); font-size:13px; }
  button { appearance:none; border:1px solid var(--card-border); background:rgba(255,255,255,0.08); color:var(--text); padding:9px 18px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; }
  .hint { margin-top:16px; font-size:12px; color:var(--text-dim); text-align:center; max-width:300px; }
  footer { margin-top:20px; font-size:12px; color:var(--text-dim); }
  footer a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
  <h1>Dino Run</h1>
  <div class="hud">
    <div class="panel"><div class="label">Score</div><div class="value" id="score">0</div></div>
    <div class="panel"><div class="label">Best</div><div class="value" id="best">0</div></div>
  </div>
  <div class="board-wrap">
    <canvas id="board" width="300" height="200"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">Dino Run</h2>
      <p id="overlaySub">Tap or press Space to jump</p>
      <button id="overlayBtn">Start</button>
    </div>
  </div>
  <p class="hint">Tap the board, click, or press Space / ↑ to jump over cacti. Speed ramps up the longer you survive.</p>
  <footer>Served from <a href="/">mcp-info-server</a> · <a href="/games.html">All games</a></footer>
<script>
(function () {
  const W = 300, H = 200;
  const GROUND_Y = H - 30;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const overlayBtn = document.getElementById('overlayBtn');

  const DINO_X = 40, DINO_W = 20, DINO_H = 22;
  const GRAVITY = 0.9;
  const JUMP_V = -11.5;

  let dinoY, dinoVY, onGround, obstacles, speed, score, best, running, frame, spawnTimer;

  best = parseInt(localStorage.getItem('dinorunBest') || '0', 10) || 0;
  bestEl.textContent = best;

  function reset() {
    dinoY = GROUND_Y - DINO_H;
    dinoVY = 0;
    onGround = true;
    obstacles = [];
    speed = 3.2;
    score = 0;
    frame = 0;
    spawnTimer = 60;
    scoreEl.textContent = 0;
  }

  function startGame() {
    reset();
    running = true;
    overlay.classList.add('hide');
    requestAnimationFrame(loop);
  }

  function jump() {
    if (!running) return;
    if (onGround) {
      dinoVY = JUMP_V;
      onGround = false;
    }
  }

  function spawnObstacle() {
    const tall = Math.random() < 0.3;
    const h = tall ? 30 : 18;
    const w = tall ? 12 : (Math.random() < 0.5 ? 20 : 12);
    obstacles.push({ x: W + 10, y: GROUND_Y - h, w, h });
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(184,192,224,0.4)';
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y + 0.5);
    ctx.lineTo(W, GROUND_Y + 0.5);
    ctx.stroke();

    ctx.fillStyle = '#a7f3d0';
    obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.w, o.h));

    ctx.fillStyle = '#7dd3fc';
    ctx.fillRect(DINO_X, dinoY, DINO_W, DINO_H);
    ctx.fillStyle = '#0f0c29';
    ctx.fillRect(DINO_X + DINO_W - 7, dinoY + 5, 3, 3);
  }

  function loop() {
    if (!running) return;
    frame++;

    dinoVY += GRAVITY;
    dinoY += dinoVY;
    if (dinoY >= GROUND_Y - DINO_H) {
      dinoY = GROUND_Y - DINO_H;
      dinoVY = 0;
      onGround = true;
    }

    speed += 0.0025;

    spawnTimer--;
    if (spawnTimer <= 0) {
      spawnObstacle();
      spawnTimer = Math.max(35, 75 - Math.floor(speed * 8)) + Math.floor(Math.random() * 30);
    }

    obstacles.forEach(o => o.x -= speed);
    obstacles = obstacles.filter(o => o.x + o.w > 0);

    for (const o of obstacles) {
      if (DINO_X + DINO_W - 4 > o.x && DINO_X + 4 < o.x + o.w && dinoY + DINO_H - 2 > o.y) {
        running = false;
        if (score > best) {
          best = score;
          localStorage.setItem('dinorunBest', String(best));
        }
        bestEl.textContent = best;
        overlayTitle.textContent = 'Game Over';
        overlaySub.textContent = 'Score: ' + score;
        overlayBtn.textContent = 'Try Again';
        overlay.classList.remove('hide');
        draw();
        return;
      }
    }

    if (frame % 6 === 0) {
      score++;
      scoreEl.textContent = score;
    }

    draw();
    requestAnimationFrame(loop);
  }

  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); }, { passive: false });
  canvas.addEventListener('mousedown', jump);
  document.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'ArrowUp') {
      e.preventDefault();
      jump();
    }
  });

  overlayBtn.addEventListener('click', startGame);

  reset();
  draw();
})();
</script>
</body>
</html>
