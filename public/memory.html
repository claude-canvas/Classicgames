<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Memory Match</title>
<style>
  :root { --bg-1:#0f0c29; --bg-2:#302b63; --bg-3:#24243e; --accent:#7dd3fc; --accent-2:#a78bfa; --card-bg:rgba(255,255,255,0.06); --card-border:rgba(255,255,255,0.14); --text:#eef2ff; --text-dim:#b8c0e0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overscroll-behavior:none; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif; background:linear-gradient(135deg,var(--bg-1),var(--bg-2) 50%,var(--bg-3)); color:var(--text); display:flex; flex-direction:column; align-items:center; padding:18px 14px 24px; min-height:100%; user-select:none; }
  h1 { font-size:clamp(24px,6vw,32px); margin:0 0 12px; background:linear-gradient(90deg,#fff,var(--accent) 60%,var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hud { display:flex; gap:14px; margin-bottom:14px; }
  .hud .panel { background:var(--card-bg); border:1px solid var(--card-border); border-radius:12px; padding:8px 18px; text-align:center; }
  .hud .label { font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); }
  .hud .value { font-size:20px; font-weight:700; color:var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; width:300px; }
  .card { aspect-ratio:1/1; border-radius:10px; background:rgba(255,255,255,0.06); border:1px solid var(--card-border); display:flex; align-items:center; justify-content:center; font-size:28px; cursor:pointer; transition:transform 0.15s ease, background 0.15s ease; }
  .card.flipped, .card.matched { background:rgba(125,211,252,0.14); border-color:rgba(125,211,252,0.4); }
  .card.matched { opacity:0.55; }
  .card .back { display:none; }
  .card.flipped .back, .card.matched .back { display:block; }
  .card .front { display:block; color:var(--text-dim); font-size:20px; }
  .card.flipped .front, .card.matched .front { display:none; }
  .overlay { margin-top:20px; text-align:center; display:none; flex-direction:column; align-items:center; gap:10px; }
  .overlay.show { display:flex; }
  .overlay h2 { margin:0; font-size:22px; color:var(--accent); }
  .overlay p { margin:0; color:var(--text-dim); font-size:13px; }
  button { appearance:none; border:1px solid var(--card-border); background:rgba(255,255,255,0.08); color:var(--text); padding:9px 18px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; margin-top:16px; }
  footer { margin-top:20px; font-size:12px; color:var(--text-dim); }
  footer a { color:var(--accent); text-decoration:none; }
</style>
<style id="fullscreen-override">
  .grid { width: min(94vw, 480px) !important; }
</style>
</head>
<body>
  <h1>Memory Match</h1>
  <div class="hud">
    <div class="panel"><div class="label">Moves</div><div class="value" id="moves">0</div></div>
    <div class="panel"><div class="label">Pairs</div><div class="value" id="pairs">0/8</div></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="overlay" id="overlay">
    <h2>Solved!</h2>
    <p id="overlaySub">Moves: 0</p>
  </div>
  <button id="newGameBtn">New Game</button>
  <footer>Served from <a href="/">mcp-info-server</a> · <a href="/games.html">All games</a></footer>
<script>
(function () {
  const EMOJIS = ['🍟', '🍇', '🎸', '🚀', '🌙', '⚡', '🎮', '🌮'];
  const grid = document.getElementById('grid');
  const movesEl = document.getElementById('moves');
  const pairsEl = document.getElementById('pairs');
  const overlay = document.getElementById('overlay');
  const overlaySub = document.getElementById('overlaySub');
  const newGameBtn = document.getElementById('newGameBtn');

  let cards, flipped, moves, matchedCount, lock;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function newGame() {
    const values = shuffle([...EMOJIS, ...EMOJIS]);
    cards = values.map((val, i) => ({ id: i, val, matched: false }));
    flipped = [];
    moves = 0;
    matchedCount = 0;
    lock = false;
    movesEl.textContent = moves;
    pairsEl.textContent = matchedCount + '/8';
    overlay.classList.remove('show');
    render();
  }

  function render() {
    grid.innerHTML = '';
    cards.forEach(card => {
      const el = document.createElement('div');
      el.className = 'card' + (card.matched ? ' matched' : flipped.includes(card.id) ? ' flipped' : '');
      el.innerHTML = '<span class="front">?</span><span class="back">' + card.val + '</span>';
      el.addEventListener('click', () => onCardClick(card.id));
      grid.appendChild(el);
    });
  }

  function onCardClick(id) {
    if (lock) return;
    const card = cards.find(c => c.id === id);
    if (card.matched || flipped.includes(id)) return;
    if (flipped.length >= 2) return;

    flipped.push(id);
    render();

    if (flipped.length === 2) {
      moves++;
      movesEl.textContent = moves;
      const [a, b] = flipped.map(fid => cards.find(c => c.id === fid));
      if (a.val === b.val) {
        a.matched = true;
        b.matched = true;
        matchedCount++;
        pairsEl.textContent = matchedCount + '/8';
        flipped = [];
        render();
        if (matchedCount === 8) {
          overlaySub.textContent = 'Moves: ' + moves;
          overlay.classList.add('show');
        }
      } else {
        lock = true;
        setTimeout(() => {
          flipped = [];
          lock = false;
          render();
        }, 700);
      }
    }
  }

  newGameBtn.addEventListener('click', newGame);
  newGame();
})();
</script>
</body>
</html>
