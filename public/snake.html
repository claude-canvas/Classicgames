<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Snake</title>
<style>
  :root {
    --bg-1: #0f0c29;
    --bg-2: #302b63;
    --bg-3: #24243e;
    --accent: #7dd3fc;
    --accent-2: #a78bfa;
    --food: #f472b6;
    --card-bg: rgba(255,255,255,0.06);
    --card-border: rgba(255,255,255,0.14);
    --text: #eef2ff;
    --text-dim: #b8c0e0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    overscroll-behavior: none;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2) 50%, var(--bg-3));
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 14px 24px;
    min-height: 100%;
    user-select: none;
  }
  h1 {
    font-size: clamp(24px, 6vw, 32px);
    margin: 0 0 12px;
    background: linear-gradient(90deg, #fff, var(--accent) 60%, var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hud {
    display: flex;
    gap: 24px;
    margin-bottom: 12px;
  }
  .hud .panel {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 8px 18px;
    text-align: center;
  }
  .hud .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
  }
  .hud .value {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
  }
  .board-wrap {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 8px;
    backdrop-filter: blur(6px);
  }
  canvas#board {
    display: block;
    border-radius: 8px;
    background: rgba(0,0,0,0.35);
  }
  .overlay {
    position: absolute;
    inset: 8px;
    background: rgba(10, 8, 30, 0.85);
    border-radius: 8px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 16px;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 22px; color: var(--accent); }
  .overlay p { margin: 0; color: var(--text-dim); font-size: 13px; }
  button {
    appearance: none;
    border: 1px solid var(--card-border);
    background: rgba(255,255,255,0.08);
    color: var(--text);
    padding: 9px 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { transform: scale(0.96); }
  .dpad {
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 60px);
    gap: 6px;
  }
  .dpad button {
    font-size: 20px;
    border-radius: 12px;
  }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .pause { grid-column: 2; grid-row: 2; font-size: 14px; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 3; }
  footer { margin-top: 20px; font-size: 12px; color: var(--text-dim); }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
  <h1>Snake</h1>

  <div class="hud">
    <div class="panel"><div class="label">Score</div><div class="value" id="score">0</div></div>
    <div class="panel"><div class="label">Best</div><div class="value" id="best">0</div></div>
  </div>

  <div class="board-wrap">
    <canvas id="board" width="300" height="300"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">Snake</h2>
      <p id="overlaySub">Swipe, use arrow keys, or the pad below</p>
      <button id="overlayBtn">Start</button>
    </div>
  </div>

  <div class="dpad">
    <button class="up" id="btnUp">↑</button>
    <button class="left" id="btnLeft">←</button>
    <button class="pause" id="btnPause">⏸</button>
    <button class="right" id="btnRight">→</button>
    <button class="down" id="btnDown">↓</button>
  </div>

  <footer>Served from <a href="/">mcp-info-server</a></footer>

<script>
(function () {
  const CELLS = 15, CELL = 20;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const overlayBtn = document.getElementById('overlayBtn');

  const BEST_KEY = 'snake_best_score';
  let best = Number(localStorageSafeGet(BEST_KEY)) || 0;
  bestEl.textContent = best;

  function localStorageSafeGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function localStorageSafeSet(key, val) {
    try { localStorage.setItem(key, val); } catch (e) { /* ignore */ }
  }

  let snake, dir, nextDir, food, score, speed, timer, running, gameOver;

  function randomFood() {
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS) };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    return pos;
  }

  function reset() {
    snake = [{ x: 7, y: 7 }, { x: 6, y: 7 }, { x: 5, y: 7 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    food = randomFood();
    score = 0;
    speed = 160;
    gameOver = false;
    scoreEl.textContent = score;
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    for (let i = 0; i <= CELLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, CELLS * CELL);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(CELLS * CELL, i * CELL);
      ctx.stroke();
    }

    ctx.fillStyle = '#f472b6';
    ctx.shadowColor = '#f472b6';
    ctx.shadowBlur = 10;
    ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);
    ctx.shadowBlur = 0;

    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? '#7dd3fc' : 'rgba(125,211,252,0.75)';
      ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
    });
  }

  function step() {
    if (!running || gameOver) return;

    if ((nextDir.x !== -dir.x || nextDir.y !== -dir.y)) {
      dir = nextDir;
    }

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= CELLS || head.y < 0 || head.y >= CELLS) {
      return endGame();
    }
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return endGame();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      food = randomFood();
      speed = Math.max(70, speed - 3);
      restartTimer();
    } else {
      snake.pop();
    }

    draw();
  }

  function restartTimer() {
    clearInterval(timer);
    timer = setInterval(step, speed);
  }

  function endGame() {
    gameOver = true;
    running = false;
    clearInterval(timer);
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorageSafeSet(BEST_KEY, best);
    }
    overlayTitle.textContent = 'Game Over';
    overlaySub.textContent = 'Score: ' + score;
    overlayBtn.textContent = 'Play Again';
    overlay.classList.add('show');
  }

  function start() {
    reset();
    running = true;
    overlay.classList.remove('show');
    restartTimer();
  }

  function togglePause() {
    if (gameOver) return;
    running = !running;
    if (running) {
      overlay.classList.remove('show');
      restartTimer();
    } else {
      clearInterval(timer);
      overlayTitle.textContent = 'Paused';
      overlaySub.textContent = 'Tap resume to continue';
      overlayBtn.textContent = 'Resume';
      overlay.classList.add('show');
    }
  }

  overlayBtn.addEventListener('click', () => {
    if (gameOver || !snake) {
      start();
    } else {
      togglePause();
    }
  });

  function setDir(x, y) {
    if (!running) return;
    nextDir = { x, y };
  }

  document.getElementById('btnUp').addEventListener('click', () => setDir(0, -1));
  document.getElementById('btnDown').addEventListener('click', () => setDir(0, 1));
  document.getElementById('btnLeft').addEventListener('click', () => setDir(-1, 0));
  document.getElementById('btnRight').addEventListener('click', () => setDir(1, 0));
  document.getElementById('btnPause').addEventListener('click', togglePause);

  document.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowUp': setDir(0, -1); break;
      case 'ArrowDown': setDir(0, 1); break;
      case 'ArrowLeft': setDir(-1, 0); break;
      case 'ArrowRight': setDir(1, 0); break;
      case ' ': case 'p': case 'P': togglePause(); break;
    }
  });

  let touchStartX = 0, touchStartY = 0;
  canvas.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, { passive: true });
  canvas.addEventListener('touchend', (e) => {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (Math.abs(dx) > 20) setDir(dx > 0 ? 1 : -1, 0);
    } else {
      if (Math.abs(dy) > 20) setDir(0, dy > 0 ? 1 : -1);
    }
  }, { passive: true });

  reset();
  running = false;
})();
</script>
</body>
</html>
