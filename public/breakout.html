<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Breakout</title>
<style>
  :root { --bg-1:#0f0c29; --bg-2:#302b63; --bg-3:#24243e; --accent:#7dd3fc; --accent-2:#a78bfa; --card-bg:rgba(255,255,255,0.06); --card-border:rgba(255,255,255,0.14); --text:#eef2ff; --text-dim:#b8c0e0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overscroll-behavior:none; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif; background:linear-gradient(135deg,var(--bg-1),var(--bg-2) 50%,var(--bg-3)); color:var(--text); display:flex; flex-direction:column; align-items:center; padding:18px 14px 24px; min-height:100%; user-select:none; }
  h1 { font-size:clamp(24px,6vw,32px); margin:0 0 12px; background:linear-gradient(90deg,#fff,var(--accent) 60%,var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hud { display:flex; gap:24px; margin-bottom:12px; }
  .hud .panel { background:var(--card-bg); border:1px solid var(--card-border); border-radius:12px; padding:8px 18px; text-align:center; }
  .hud .label { font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); }
  .hud .value { font-size:20px; font-weight:700; color:var(--accent); }
  .board-wrap { position:relative; background:var(--card-bg); border:1px solid var(--card-border); border-radius:16px; padding:8px; touch-action:none; }
  canvas#board { display:block; border-radius:8px; background:rgba(0,0,0,0.35); }
  .overlay { position:absolute; inset:8px; background:rgba(10,8,30,0.85); border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:16px; }
  .overlay.hide { display:none; }
  .overlay h2 { margin:0; font-size:22px; color:var(--accent); }
  .overlay p { margin:0; color:var(--text-dim); font-size:13px; }
  button { appearance:none; border:1px solid var(--card-border); background:rgba(255,255,255,0.08); color:var(--text); padding:9px 18px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; }
  .hint { margin-top:16px; font-size:12px; color:var(--text-dim); text-align:center; max-width:300px; }
  footer { margin-top:20px; font-size:12px; color:var(--text-dim); }
  footer a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
  <h1>Breakout</h1>
  <div class="hud">
    <div class="panel"><div class="label">Score</div><div class="value" id="score">0</div></div>
    <div class="panel"><div class="label">Lives</div><div class="value" id="lives">3</div></div>
  </div>
  <div class="board-wrap">
    <canvas id="board" width="300" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">Breakout</h2>
      <p id="overlaySub">Drag to move the paddle</p>
      <button id="overlayBtn">Start</button>
    </div>
  </div>
  <p class="hint">Drag on the board or use ← → keys. Clear every brick to win.</p>
  <footer>Served from <a href="/">mcp-info-server</a> · <a href="/games.html">All games</a></footer>
<script>
(function () {
  const W = 300, H = 400;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const overlayBtn = document.getElementById('overlayBtn');

  const PADDLE_W = 60, PADDLE_H = 10;
  const ROWS = 5, COLS = 8;
  const BRICK_W = W / COLS, BRICK_H = 16;
  const BRICK_COLORS = ['#f472b6', '#fb923c', '#fde68a', '#a7f3d0', '#7dd3fc'];

  let paddleX, ballX, ballY, ballVX, ballVY, bricks, score, lives, running, launched;

  function initBricks() {
    bricks = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        bricks.push({ x: c * BRICK_W, y: r * BRICK_H + 30, w: BRICK_W, h: BRICK_H, alive: true, color: BRICK_COLORS[r % BRICK_COLORS.length] });
      }
    }
  }

  function resetBall() {
    ballX = W / 2;
    ballY = H - 40;
    ballVX = 0;
    ballVY = 0;
    launched = false;
  }

  function startGame() {
    paddleX = W / 2 - PADDLE_W / 2;
    score = 0;
    lives = 3;
    scoreEl.textContent = score;
    livesEl.textContent = lives;
    initBricks();
    resetBall();
    running = true;
    overlay.classList.add('hide');
    requestAnimationFrame(loop);
  }

  function launch() {
    if (launched || !running) return;
    launched = true;
    ballVX = (Math.random() > 0.5 ? 1 : -1) * 2.4;
    ballVY = -3.6;
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    bricks.forEach(b => {
      if (!b.alive) return;
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    });

    ctx.fillStyle = '#7dd3fc';
    ctx.fillRect(paddleX, H - 20, PADDLE_W, PADDLE_H);

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(ballX, ballY, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  function loop() {
    if (!running) return;

    if (!launched) {
      ballX = paddleX + PADDLE_W / 2;
      draw();
      requestAnimationFrame(loop);
      return;
    }

    ballX += ballVX;
    ballY += ballVY;

    if (ballX - 6 < 0 || ballX + 6 > W) { ballVX *= -1; ballX = Math.max(6, Math.min(W - 6, ballX)); }
    if (ballY - 6 < 0) { ballVY *= -1; ballY = 6; }

    if (ballY + 6 > H - 20 && ballY + 6 < H - 10 && ballX > paddleX && ballX < paddleX + PADDLE_W && ballVY > 0) {
      ballVY *= -1;
      const hitPos = (ballX - (paddleX + PADDLE_W / 2)) / (PADDLE_W / 2);
      ballVX += hitPos * 1.2;
      ballVX = Math.max(-5, Math.min(5, ballVX));
    }

    for (const b of bricks) {
      if (!b.alive) continue;
      if (ballX + 6 > b.x && ballX - 6 < b.x + b.w && ballY + 6 > b.y && ballY - 6 < b.y + b.h) {
        b.alive = false;
        ballVY *= -1;
        score += 10;
        scoreEl.textContent = score;
        break;
      }
    }

    if (ballY > H) {
      lives--;
      livesEl.textContent = lives;
      if (lives <= 0) {
        running = false;
        overlayTitle.textContent = 'Game Over';
        overlaySub.textContent = 'Score: ' + score;
        overlayBtn.textContent = 'Try Again';
        overlay.classList.remove('hide');
        draw();
        return;
      }
      resetBall();
    }

    if (bricks.every(b => !b.alive)) {
      running = false;
      overlayTitle.textContent = 'You Win!';
      overlaySub.textContent = 'Score: ' + score;
      overlayBtn.textContent = 'Play Again';
      overlay.classList.remove('hide');
      draw();
      return;
    }

    draw();
    requestAnimationFrame(loop);
  }

  function setPaddleCenter(clientX) {
    const rect = canvas.getBoundingClientRect();
    const scale = W / rect.width;
    const x = (clientX - rect.left) * scale;
    paddleX = Math.max(0, Math.min(W - PADDLE_W, x - PADDLE_W / 2));
  }

  canvas.addEventListener('touchstart', (e) => { setPaddleCenter(e.touches[0].clientX); launch(); }, { passive: true });
  canvas.addEventListener('touchmove', (e) => { e.preventDefault(); setPaddleCenter(e.touches[0].clientX); }, { passive: false });
  canvas.addEventListener('mousedown', (e) => { setPaddleCenter(e.clientX); launch(); });
  canvas.addEventListener('mousemove', (e) => { if (e.buttons === 1) setPaddleCenter(e.clientX); });

  document.addEventListener('keydown', (e) => {
    if (!running) return;
    if (e.key === 'ArrowLeft') paddleX = Math.max(0, paddleX - 18);
    if (e.key === 'ArrowRight') paddleX = Math.min(W - PADDLE_W, paddleX + 18);
    if (e.key === ' ') launch();
  });

  overlayBtn.addEventListener('click', startGame);

  paddleX = W / 2 - PADDLE_W / 2;
  initBricks();
  resetBall();
  draw();
})();
</script>
</body>
</html>
