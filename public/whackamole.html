<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const GAME_MS = 30000, HOLES = 9;
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const coarse = matchMedia("(pointer: coarse)").matches;

  // ---------- background ----------
  // foreground grass: a strip of blades, each swaying on its own rhythm
  {
    const W = 1000, H = 200, greens = ["#3f8f2f", "#4fa53a", "#5fb544", "#6cc24f", "#357a28"];
    const layers = Array.from({ length: 5 }, () => "");
    for (let i = 0; i < 70; i++) {
      const x = (i / 70) * W + Math.random() * 12, h = 70 + Math.random() * 120, w = 9 + Math.random() * 10, lean = (Math.random() - 0.5) * 40;
      layers[i % 5] += `<path d="M${x - w / 2} ${H} Q${x + lean * 0.4} ${H - h * 0.55} ${x + lean} ${H - h} Q${x + lean * 0.3 + w * 0.2} ${H - h * 0.5} ${x + w / 2} ${H} Z" fill="${greens[i % greens.length]}"/>`;
    }
    $("sway").innerHTML = layers.map((paths, k) => `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="--d:${(2.6 + k * 0.45).toFixed(2)}s;--delay:-${(k * 0.7).toFixed(1)}s;--a:${(4 + (k % 3) * 1.5).toFixed(1)}deg">${paths}</svg>`).join("");
    for (let i = 0; i < 16; i++) {
      const p = document.createElement("div");
      p.className = "pollen";
      p.style.cssText = `left:${Math.random() * 100}vw;top:${40 + Math.random() * 55}vh;--d:${10 + Math.random() * 10}s;--delay:-${Math.random() * 15}s;--dx:${(Math.random() - 0.3) * 260}px;--dy:${-120 - Math.random() * 200}px`;
      document.body.appendChild(p);
    }
  }
  // the live 3D meadow (Grass Wallpaper) is optional: lovely, but heavy on slower devices
  let bg = null;
  const liveBtn = $("live");
  function setLive(on) {
    try { localStorage.setItem("whackamole.live", on ? "1" : "0"); } catch { }
    liveBtn.setAttribute("aria-pressed", on);
    if (on && !bg) {
      bg = document.createElement("iframe");
      bg.id = "bg"; bg.title = ""; bg.tabIndex = -1; bg.setAttribute("aria-hidden", "true");
      bg.addEventListener("load", () => {
        bg.classList.add("on");
        try {   // the meadow only sways, so ~30 fps is plenty; it leaves the main thread free for the game
          const w = bg.contentWindow, raf = w.requestAnimationFrame.bind(w);
          let last = 0;
          w.requestAnimationFrame = (cb) => raf(function step(t) { if (t - last >= 31) { last = t; cb(t); } else raf(step); });
        } catch { }
      });
      bg.src = `/grasswallpaper.html?blades=${Math.min(innerWidth, innerHeight) < 600 || coarse ? 9000 : 16000}`;
      $("meadow").after(bg);
    } else if (!on && bg) { bg.remove(); bg = null; }
  }
  setLive((() => { try { return localStorage.getItem("whackamole.live") === "1"; } catch { return false; } })());
  liveBtn.addEventListener("click", () => setLive(!bg));

  // ---------- sound (Web Audio, nothing to download) ----------
  const sound = {
    ctx: null, muted: (() => { try { return localStorage.getItem("whackamole.muted") === "1"; } catch { return false; } })(),
    init() {
      if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC(); this.out = this.ctx.createGain(); this.out.gain.value = this.muted ? 0 : 0.7; this.out.connect(this.ctx.destination);
      this.noise = this.ctx.createBuffer(1, this.ctx.sampleRate, this.ctx.sampleRate); const d = this.noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    },
    get ok() { return this.ctx && !this.muted && this.ctx.state === "running"; },
    toggle() { this.muted = !this.muted; try { localStorage.setItem("whackamole.muted", this.muted ? "1" : "0"); } catch { } if (this.out) this.out.gain.value = this.muted ? 0 : 0.7; return this.muted; },
    tone(f0, f1, dur, type, v, delay = 0) { const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g).connect(this.out); o.start(t); o.stop(t + dur + 0.02); },
    burst(freq, q, v, dur) { const t = this.ctx.currentTime, s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain(); s.buffer = this.noise; f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); s.connect(f).connect(g).connect(this.out); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02); },
    bonk(combo) { if (!this.ok) return; this.tone(520 + combo * 25, 180, 0.12, "triangle", 0.45); this.burst(1800, 2, 0.25, 0.06); this.tone(900 + combo * 40, 1300 + combo * 40, 0.08, "sine", 0.12, 0.03); },
    gold() { if (!this.ok) return; [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, f, 0.25, "triangle", 0.18, i * 0.06)); this.burst(1800, 2, 0.2, 0.06); },
    boom() { if (!this.ok) return; this.tone(160, 40, 0.5, "sine", 0.6); this.burst(500, 0.6, 0.6, 0.4); },
    whiff() { if (!this.ok) return; this.burst(900, 1.5, 0.12, 0.08); },
    popup() { if (!this.ok) return; this.tone(300, 520, 0.07, "sine", 0.06); },
    tick(hi) { if (!this.ok) return; this.tone(hi ? 1400 : 1000, hi ? 1400 : 1000, 0.05, "square", 0.05); },
    go() { if (!this.ok) return; [523, 659, 784].forEach((f, i) => this.tone(f, f, 0.22, "triangle", 0.18, i * 0.08)); },
    end() { if (!this.ok) return; [784, 659, 523, 659, 784, 1047].forEach((f, i) => this.tone(f, f, 0.3, "triangle", 0.16, i * 0.11)); },
  };
  const muteBtn = $("mute");
  const syncMute = () => muteBtn.setAttribute("aria-pressed", sound.muted);
  syncMute();

  // ---------- board ----------
  const MOLE = $("moleTpl").innerHTML;
  for (const slot of document.querySelectorAll("[data-mole]")) slot.innerHTML = MOLE;
  const board = $("board");
  const holes = [];
  const PIT = '<svg class="pit" viewBox="0 0 100 34"><ellipse cx="50" cy="17" rx="40" ry="14" fill="url(#gPit)"/><ellipse cx="50" cy="15" rx="40" ry="12" fill="none" stroke="#2a180a" stroke-width="2" opacity="0.6"/></svg>';
  const LIP = '<svg class="lip" viewBox="0 0 100 34"><path d="M6 12 C8 30 92 30 94 12 C96 24 84 34 50 34 C16 34 4 24 6 12 Z" fill="url(#gLip)"/><path d="M10 14 C20 27 80 27 90 14" fill="none" stroke="#b98a5a" stroke-width="2" opacity="0.6"/>' +
    '<g fill="#4fa53a"><path d="M8 26 q2 -12 5 -2 q1 -9 4 1z"/><path d="M84 26 q2 -12 5 -2 q1 -9 4 1z"/><path d="M40 33 q2 -9 4 -1 q2 -8 4 1z"/><path d="M62 32 q1 -8 3 -1 q2 -7 3 1z"/></g>' +
    '<g fill="#6cc24f"><path d="M12 27 q1 -8 3 -1z"/><path d="M88 27 q1 -8 3 -1z"/><path d="M45 34 q1 -7 3 -1z"/></g></svg>';
  for (let r = 0; r < 3; r++) {
    const row = document.createElement("div");
    row.className = `row r${r}`;
    for (let c = 0; c < 3; c++) {
      const el = document.createElement("div");
      el.className = "hole";
      el.innerHTML = `${PIT}<div class="clip"><div class="mole">${MOLE}</div></div>${LIP}`;
      row.appendChild(el);
      const h = { el, i: holes.length, state: "down", kind: "mole", until: 0 };
      holes.push(h);
      el.addEventListener("pointerdown", (e) => { e.preventDefault(); whack(h, e); });
    }
    board.appendChild(row);
  }

  // ---------- game state ----------
  let state = "title", score = 0, combo = 0, bestCombo = 0, hits = 0, swings = 0;
  let timeLeft = GAME_MS, elapsed = 0, nextSpawn = 0, lastTick = 0, overAt = 0;
  const best = () => { try { return +localStorage.getItem("whackamole.best") || 0; } catch { return 0; } };
  $("t-best").textContent = best();
  const show = (which) => { for (const id of ["title", "paused", "over"]) $(id).classList.toggle("hidden", id !== which); document.body.dataset.state = which || "play"; };
  const mult = () => Math.min(4, 1 + Math.floor(combo / 5));

  function updateHud() {
    $("scoreVal").textContent = score;
    $("comboVal").textContent = "×" + mult();
    $("comboBar").style.width = (mult() === 4 ? 100 : (combo % 5) * 20) + "%";
    $("combo").classList.toggle("hot", mult() >= 2);
    const s = Math.ceil(timeLeft / 1000);
    $("timeVal").textContent = Math.max(0, s);
    $("ring").style.strokeDashoffset = 163.4 * (1 - timeLeft / GAME_MS);
    $("timer").classList.toggle("low", timeLeft <= 5000);
  }
  function bumpScore() { const el = $("scoreVal"); el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }

  function setKind(h, kind) { h.kind = kind; h.el.classList.remove("kind-mole", "kind-gold", "kind-bomb"); h.el.classList.add("kind-" + kind); }
  function raise(h, now) {
    const t = elapsed / 1000;
    const r = Math.random();
    setKind(h, t > 4 && r < 0.13 ? "bomb" : r > 0.92 ? "gold" : "mole");
    const stay = Math.max(560, 1150 - t * 17) * (h.kind === "gold" ? 0.75 : h.kind === "bomb" ? 1.25 : 1);
    h.state = "up"; h.until = now + stay;
    h.el.classList.remove("hit", "leave"); h.el.classList.add("up");
    sound.popup();
  }
  function lower(h, escaped) {
    h.state = "down";
    h.el.classList.remove("up", "hit"); h.el.classList.add("leave");
    if (escaped && h.kind !== "bomb" && combo > 0) { combo = 0; updateHud(); }
  }

  function whack(h, e) {
    if (state !== "play") return;
    sound.init();
    swing(e.clientX, e.clientY);
    swings++;
    if (h.state !== "up") { combo = 0; updateHud(); sound.whiff(); dust(e.clientX, e.clientY, 5); return; }
    h.state = "hit";
    h.el.classList.add("hit");
    const rect = h.el.getBoundingClientRect(), x = rect.left + rect.width / 2, y = rect.top + rect.height * 0.32;
    if (h.kind === "bomb") {
      score = Math.max(0, score - 3); timeLeft = Math.max(0, timeLeft - 2000); combo = 0;
      sound.boom(); boom(x, y + rect.height * 0.2); popText(x, y, "−3  −2s", "bad");
      $("flash").classList.add("on"); setTimeout(() => $("flash").classList.remove("on"), 60);
      if (!reducedMotion) { board.classList.remove("shake"); void board.offsetWidth; board.classList.add("shake"); }
      if (navigator.vibrate) try { navigator.vibrate(80); } catch { }
      setTimeout(() => lower(h, false), 120);
    } else {
      hits++; combo++; bestCombo = Math.max(bestCombo, combo);
      const pts = (h.kind === "gold" ? 5 : 1) * mult();
      score += pts;
      if (h.kind === "gold") sound.gold(); else sound.bonk(combo);
      stars(x, y, h.kind === "gold" ? 12 : 7, h.kind === "gold");
      popText(x, y - 10, "+" + pts + (mult() > 1 ? `  ×${mult()}` : ""), h.kind === "gold" ? "gold" : "");
      if (combo > 0 && combo % 5 === 0 && combo <= 15) popText(innerWidth / 2, innerHeight * 0.3, `COMBO ×${mult()}!`, "gold");
      if (navigator.vibrate) try { navigator.vibrate(12); } catch { }
      bumpScore();
      setTimeout(() => lower(h, false), 380);
    }
    updateHud();
  }

  // ---------- effects (Web Animations API) ----------
  function fx(cls, x, y, html = "") { const el = document.createElement("div"); el.className = "fx " + cls; el.style.left = x + "px"; el.style.top = y + "px"; el.innerHTML = html; document.body.appendChild(el); return el; }
  function popText(x, y, text, kind) {
    const el = fx("pop " + (kind || ""), x, y); el.textContent = text;
    el.animate([{ opacity: 0, transform: "translate(-50%,-50%) scale(0.5)" }, { opacity: 1, transform: "translate(-50%,-80%) scale(1.15)", offset: 0.25 }, { opacity: 1, transform: "translate(-50%,-120%) scale(1)", offset: 0.7 }, { opacity: 0, transform: "translate(-50%,-170%) scale(0.95)" }], { duration: 850, easing: "ease-out" }).onfinish = () => el.remove();
  }
  const STAR = '<svg viewBox="0 0 20 20"><path d="M10 0 l2.6 6.6 7 .6 -5.4 4.6 1.7 7 -5.9 -3.8 -5.9 3.8 1.7 -7 -5.4 -4.6 7 -.6z" fill="#ffd34d" stroke="#c98a13" stroke-width="1"/></svg>';
  function stars(x, y, n, gold) {
    for (let i = 0; i < n; i++) {
      const el = fx("star", x, y, STAR), a = (i / n) * Math.PI * 2 + Math.random() * 0.5, d = 50 + Math.random() * 50 * (gold ? 1.5 : 1);
      el.animate([{ transform: "translate(0,0) scale(0.4) rotate(0deg)", opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d - 20}px) scale(${gold ? 1.3 : 1}) rotate(${(Math.random() - 0.5) * 360}deg)`, opacity: 0 }], { duration: 550 + Math.random() * 250, easing: "cubic-bezier(.2,.8,.3,1)" }).onfinish = () => el.remove();
    }
  }
  function dust(x, y, n) {
    for (let i = 0; i < n; i++) {
      const el = fx("dust", x, y), a = -Math.PI * Math.random(), d = 20 + Math.random() * 30;
      el.animate([{ transform: "translate(0,0) scale(0.6)", opacity: 0.9 }, { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d}px) scale(1.4)`, opacity: 0 }], { duration: 450, easing: "ease-out" }).onfinish = () => el.remove();
    }
  }
  function boom(x, y) {
    const ring = fx("boom", x, y);
    ring.animate([{ transform: "scale(0.3)", opacity: 1 }, { transform: "scale(4)", opacity: 0 }], { duration: 450, easing: "ease-out" }).onfinish = () => ring.remove();
    for (let i = 0; i < 10; i++) {
      const el = fx("dust", x, y), a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 60;
      el.style.background = i % 2 ? "rgba(60,60,70,.8)" : "rgba(255,150,60,.85)";
      el.animate([{ transform: "translate(0,0) scale(1)", opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d}px) scale(2.4)`, opacity: 0 }], { duration: 650, easing: "ease-out" }).onfinish = () => el.remove();
    }
  }

  // ---------- hammer that follows the pointer ----------
  const hammer = $("hammer");
  let hideHammer = 0;
  function placeHammer(x, y) { hammer.style.transform = `translate(${x - 70}px, ${y - 72}px)`; }
  function swing(x, y) {
    placeHammer(x, y); hammer.classList.add("show", "swing");
    setTimeout(() => hammer.classList.remove("swing"), 90);
    clearTimeout(hideHammer);
    if (coarse) hideHammer = setTimeout(() => hammer.classList.remove("show"), 350);
  }
  addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse") return;
    placeHammer(e.clientX, e.clientY);
    hammer.classList.toggle("show", state === "play" && !!e.target.closest && !e.target.closest("#top"));
  });

  // ---------- flow ----------
  async function countdown() {
    const el = $("count");
    for (const t of ["3", "2", "1", "GO!"]) {
      el.textContent = t; el.classList.remove("go"); void el.offsetWidth; el.classList.add("go");
      t === "GO!" ? sound.go() : sound.tick(false);
      await new Promise((r) => setTimeout(r, t === "GO!" ? 500 : 650));
    }
  }
  async function start() {
    sound.init();
    show(null); document.body.dataset.state = "count";
    for (const h of holes) { h.state = "down"; h.el.classList.remove("up", "hit", "leave"); }
    score = 0; combo = 0; bestCombo = 0; hits = 0; swings = 0; timeLeft = GAME_MS; elapsed = 0;
    updateHud();
    state = "count";
    await countdown();
    if (state !== "count") return;
    state = "play"; document.body.dataset.state = "play";
    nextSpawn = performance.now() + 200; lastTick = performance.now();
  }
  function finish() {
    state = "over"; overAt = performance.now();
    for (const h of holes) if (h.state === "up") lower(h, false);
    hammer.classList.remove("show");
    const prev = best(), isNew = score > prev;
    if (isNew) try { localStorage.setItem("whackamole.best", score); } catch { }
    $("o-score").textContent = score;
    $("o-best").textContent = Math.max(score, prev);
    $("o-acc").textContent = (swings ? Math.round((hits / swings) * 100) : 0) + "%";
    $("o-combo").textContent = bestCombo;
    $("o-new").classList.toggle("hidden", !isNew);
    const n = score >= 60 ? 3 : score >= 35 ? 2 : score >= 15 ? 1 : 0;
    $("o-stars").innerHTML = "★".repeat(n) + `<em>${"★".repeat(3 - n)}</em>`;
    $("t-best").textContent = Math.max(score, prev);
    $("againBtn").classList.remove("arm"); void $("againBtn").offsetWidth; $("againBtn").classList.add("arm");
    sound.end();
    show("over");
  }
  function pause() { if (state !== "play") return; state = "paused"; show("paused"); hammer.classList.remove("show"); }
  function resume() { if (state !== "paused") return; state = "play"; show(null); lastTick = performance.now(); }

  function loop(now) {
    if (state === "play") {
      const dt = Math.min(100, now - lastTick); lastTick = now;
      timeLeft -= dt; elapsed += dt;
      const sec = Math.ceil(timeLeft / 1000);
      if (timeLeft <= 5000 && sec !== loop.lastSec) { loop.lastSec = sec; if (sec > 0) sound.tick(true); }
      for (const h of holes) if (h.state === "up" && now > h.until) lower(h, true);
      const t = elapsed / 1000, maxUp = Math.min(3, 1 + Math.floor(t / 9));
      if (now >= nextSpawn) {
        const free = holes.filter((h) => h.state === "down");
        if (holes.filter((h) => h.state === "up").length < maxUp && free.length) raise(free[Math.floor(Math.random() * free.length)], now);
        nextSpawn = now + Math.max(330, 820 - t * 15) * (0.7 + Math.random() * 0.6);
      }
      if (timeLeft <= 0) { timeLeft = 0; updateHud(); finish(); }
      else updateHud();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ---------- controls ----------
  $("startBtn").addEventListener("click", start);
  $("againBtn").addEventListener("click", () => { if (performance.now() - overAt > 700) start(); });
  $("resumeBtn").addEventListener("click", resume);
  $("quitBtn").addEventListener("click", () => { state = "title"; start(); });
  $("pause").addEventListener("click", () => { sound.init(); state === "play" ? pause() : resume(); });
  muteBtn.addEventListener("click", () => { sound.init(); sound.toggle(); syncMute(); });
  $("shareBtn").addEventListener("click", async () => {
    const url = location.origin + location.pathname, text = `I bonked ${score} points in Whack-a-Mole! Can you beat it?`;
    try { if (navigator.share) await navigator.share({ title: "Whack-a-Mole", text, url }); else { await navigator.clipboard.writeText(`${text} ${url}`); $("shareBtn").textContent = "Link copied"; } } catch { }
  });
  addEventListener("keydown", (e) => {
    if (e.code === "KeyM") { sound.init(); sound.toggle(); syncMute(); }
    else if (e.code === "KeyL") setLive(!bg);
    else if (e.code === "KeyP" || e.code === "Escape") { state === "play" ? pause() : resume(); }
    else if ((e.code === "Enter" || e.code === "Space") && !e.repeat && !(e.target instanceof HTMLButtonElement)) {
      if (state === "title") start(); else if (state === "over" && performance.now() - overAt > 700) start(); else if (state === "paused") resume();
    }
  });
  document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
  addEventListener("blur", pause);
  document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
  window.__whack = () => ({ state, score, combo, timeLeft: Math.round(timeLeft), up: holes.filter((h) => h.state === "up").map((h) => [h.i, h.kind]) });
})();
</script>
