<style>

  #loading.out { opacity: 0; pointer-events: none; }
  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; text-align: center; pointer-events: none; }

  .logo { font-family: var(--display); font-size: clamp(80px, 17vw, 220px); line-height: .85; letter-spacing: .02em; color: #fff4e4; text-shadow: 0 6px 0 rgba(120, 40, 10, .5), 0 0 60px rgba(255, 160, 80, .5); }
  .tag { color: var(--muted); font-size: 17px; max-width: 520px; line-height: 1.5; margin: 14px 0 28px; text-shadow: 0 2px 12px rgba(60, 20, 0, .6); }

  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  #stats { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 16px; display: flex; flex-direction: column; gap: 2px; pointer-events: none; text-shadow: 0 2px 10px rgba(40, 10, 0, .7); }
  #h-dist { font-family: var(--display); font-size: 46px; line-height: .9; }
  #h-score { font-family: var(--display); font-size: 28px; color: var(--sun); }
  #h-mult { font-family: var(--display); font-size: 22px; color: var(--muted); transition: color .2s, transform .2s; } #h-mult.hot { color: #ffe08a; transform: scale(1.1); transform-origin: left; }
  #h-chain { font-size: 13px; color: #ffe08a; }
  #b-pause { position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; border-radius: 50%; }
  #spd { position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(60vw, 360px); pointer-events: none; text-align: center; }
  #spd .bar { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .15); overflow: hidden; margin-top: 4px; }
  #spd-i { height: 100%; background: linear-gradient(90deg, #ffe08a, #ff7a4a); border-radius: 4px; }
  #spd.stall #spd-i { background: #ff4a3a; animation: blink .3s infinite alternate; }
  @keyframes blink { from { opacity: .4; } to { opacity: 1; } }
  #spd-v { font-family: var(--display); font-size: 20px; letter-spacing: .05em; text-shadow: 0 2px 8px #000; } #h-alt { font-size: 12px; color: var(--muted); }
  #boosts { position: absolute; right: 16px; top: 66px; display: flex; gap: 6px; pointer-events: none; } #boosts i { width: 16px; height: 22px; clip-path: polygon(50% 0, 100% 100%, 50% 75%, 0 100%); background: rgba(255, 255, 255, .2); } #boosts i.on { background: #ffe08a; filter: drop-shadow(0 0 6px #ffb35c); }

  @media (pointer: coarse) { #ctrls { display: flex; } }
  .cbtn { width: 76px; height: 76px; border-radius: 50%; font-family: var(--display); font-size: 18px; letter-spacing: .08em; }
  #pop { position: absolute; top: 28%; left: 50%; transform: translate(-50%, 10px); text-align: center; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; text-shadow: 0 2px 16px rgba(40, 10, 0, .8); }

  #pop-t { font-family: var(--display); font-size: 48px; letter-spacing: .04em; } #pop-s { font-size: 16px; color: #ffe08a; }

  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 12px 0; color: var(--muted); }

  <div id="t-best"></div>
</div>

<div id="hud" class="hidden">

  <div id="boosts"></div>
  <div id="spd"><div id="spd-v"></div><div class="bar"><div id="spd-i"></div></div><div id="h-alt"></div></div>
  <div id="ctrls"><button class="cbtn glass" id="c-brake">BRAKE</button><button class="cbtn glass" id="c-boost">FLAP</button></div>
  <div id="pop"><div id="pop-t"></div><div id="pop-s"></div></div>
  <div id="toast"></div>
</div>

<div class="modal hidden" id="m-pause"><div class="mcard glass"><div class="kicker">Paused</div><h2>CANYON GLIDE</h2>
  <div class="col"><button class="btn pri" id="p-resume">Resume</button><button class="btn" id="p-restart">Restart</button><button class="btn" id="p-set">Settings</button><button class="btn" id="p-title">Title</button></div></div></div>
<div class="modal hidden" id="m-crash"><div class="mcard glass"><div class="kicker" id="c-why"></div><div id="c-dist"></div><div id="c-score"></div><div id="c-stats"></div><div id="c-best"></div>
  <div class="col"><button class="btn pri" id="c-retry">Fly again</button><button class="btn" id="c-title">Title</button></div></div></div>
<div class="modal hidden" id="m-set"><div class="mcard glass"><div class="kicker">Settings</div><h2>SETTINGS</h2>
  <div class="set-row">Sound <input type="range" id="st-vol" min="0" max="100"></div>
  <div class="set-row">Music <input type="range" id="st-mus" min="0" max="100"></div>
  <div class="set-row">Sensitivity <input type="range" id="st-sens" min="50" max="150"></div>
  <div class="set-row">Invert pitch <div class="seg" id="st-inv"><button data-v="0">Off</button><button data-v="1">On</button></div></div>
  <div class="col"><button class="btn pri" id="st-close">Done</button></div></div></div>
