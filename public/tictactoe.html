<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tic Tac Toe</title>
<style>
  :root {
    --bg-1: #0f0c29;
    --bg-2: #302b63;
    --bg-3: #24243e;
    --accent-x: #7dd3fc;
    --accent-o: #f472b6;
    --card-bg: rgba(255,255,255,0.06);
    --card-border: rgba(255,255,255,0.14);
    --text: #eef2ff;
    --text-dim: #b8c0e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2) 50%, var(--bg-3));
    color: var(--text);
    padding: 24px;
  }
  .wrap {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  h1 {
    font-size: clamp(28px, 6vw, 40px);
    margin: 0 0 6px;
    background: linear-gradient(90deg, #fff, var(--accent-x) 60%, var(--accent-o));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .status {
    color: var(--text-dim);
    font-size: 15px;
    margin-bottom: 22px;
    min-height: 20px;
  }
  .status strong.x { color: var(--accent-x); }
  .status strong.o { color: var(--accent-o); }
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 14px;
    backdrop-filter: blur(6px);
  }
  .cell {
    aspect-ratio: 1 / 1;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(36px, 10vw, 54px);
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    transition: transform 0.12s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .cell:hover:not(.filled) {
    background: rgba(255,255,255,0.09);
    transform: translateY(-2px);
  }
  .cell.x { color: var(--accent-x); text-shadow: 0 0 18px rgba(125,211,252,0.55); }
  .cell.o { color: var(--accent-o); text-shadow: 0 0 18px rgba(244,114,182,0.55); }
  .cell.win {
    background: rgba(74,222,128,0.16);
    border-color: rgba(74,222,128,0.5);
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 24px;
  }
  button {
    appearance: none;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.2s ease;
  }
  button:hover { transform: translateY(-2px); border-color: rgba(125,211,252,0.4); }
  .scoreboard {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin-top: 20px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .scoreboard span { font-weight: 700; }
  .scoreboard .x-score span { color: var(--accent-x); }
  .scoreboard .o-score span { color: var(--accent-o); }
  footer {
    margin-top: 28px;
    font-size: 12px;
    color: var(--text-dim);
  }
  footer a { color: var(--accent-x); text-decoration: none; }
</style>
<style id="fullscreen-override">
  .wrap { max-width: min(94vw, 520px) !important; }
  body { padding: 10px !important; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Tic Tac Toe</h1>
    <div class="status" id="status">Turn: <strong class="x">X</strong></div>

    <div class="board" id="board"></div>

    <div class="controls">
      <button id="resetBtn">Restart Round</button>
      <button id="resetScoreBtn">Reset Score</button>
    </div>

    <div class="scoreboard">
      <div class="x-score">X wins: <span id="xScore">0</span></div>
      <div class="o-score">O wins: <span id="oScore">0</span></div>
      <div class="draws">Draws: <span id="drawScore">0</span></div>
    </div>

    <footer>Served from <a href="/">mcp-info-server</a></footer>
  </div>

<script>
(function () {
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const resetBtn = document.getElementById('resetBtn');
  const resetScoreBtn = document.getElementById('resetScoreBtn');
  const xScoreEl = document.getElementById('xScore');
  const oScoreEl = document.getElementById('oScore');
  const drawScoreEl = document.getElementById('drawScore');

  const WIN_LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  let board = Array(9).fill(null);
  let current = 'X';
  let gameOver = false;
  let scores = { X: 0, O: 0, draw: 0 };

  function renderBoard() {
    boardEl.innerHTML = '';
    board.forEach((val, i) => {
      const cell = document.createElement('div');
      cell.className = 'cell' + (val ? ' filled ' + val.toLowerCase() : '');
      cell.textContent = val || '';
      cell.dataset.index = i;
      cell.addEventListener('click', onCellClick);
      boardEl.appendChild(cell);
    });
  }

  function checkWinner() {
    for (const line of WIN_LINES) {
      const [a, b, c] = line;
      if (board[a] && board[a] === board[b] && board[a] === board[c]) {
        return { winner: board[a], line };
      }
    }
    if (board.every(v => v !== null)) {
      return { winner: 'draw', line: [] };
    }
    return null;
  }

  function onCellClick(e) {
    if (gameOver) return;
    const idx = Number(e.currentTarget.dataset.index);
    if (board[idx]) return;

    board[idx] = current;
    const result = checkWinner();

    if (result) {
      gameOver = true;
      renderBoard();
      if (result.winner === 'draw') {
        scores.draw++;
        statusEl.innerHTML = "It's a draw!";
      } else {
        scores[result.winner]++;
        highlightWin(result.line);
        statusEl.innerHTML = 'Winner: <strong class="' + result.winner.toLowerCase() + '">' + result.winner + '</strong>';
      }
      updateScoreboard();
      return;
    }

    current = current === 'X' ? 'O' : 'X';
    statusEl.innerHTML = 'Turn: <strong class="' + current.toLowerCase() + '">' + current + '</strong>';
    renderBoard();
  }

  function highlightWin(line) {
    line.forEach(i => {
      const cellEl = boardEl.children[i];
      if (cellEl) cellEl.classList.add('win');
    });
  }

  function updateScoreboard() {
    xScoreEl.textContent = scores.X;
    oScoreEl.textContent = scores.O;
    drawScoreEl.textContent = scores.draw;
  }

  function newRound() {
    board = Array(9).fill(null);
    current = 'X';
    gameOver = false;
    statusEl.innerHTML = 'Turn: <strong class="x">X</strong>';
    renderBoard();
  }

  function resetScores() {
    scores = { X: 0, O: 0, draw: 0 };
    updateScoreboard();
    newRound();
  }

  resetBtn.addEventListener('click', newRound);
  resetScoreBtn.addEventListener('click', resetScores);

  renderBoard();
})();
</script>
</body>
</html>
