<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Dart Throw</title>
<style>
  :root {
    --bg-1: #0f0c29;
    --bg-2: #302b63;
    --bg-3: #24243e;
    --accent: #7dd3fc;
    --accent-2: #a78bfa;
    --card-bg: rgba(255,255,255,0.06);
    --card-border: rgba(255,255,255,0.14);
    --text: #eef2ff;
    --text-dim: #b8c0e0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    overscroll-behavior: none;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2) 50%, var(--bg-3));
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 14px 24px;
    min-height: 100%;
    user-select: none;
  }
  h1 {
    font-size: clamp(24px, 6vw, 32px);
    margin: 0 0 12px;
    background: linear-gradient(90deg, #fff, var(--accent) 60%, var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hud {
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
  }
  .hud .panel {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 8px 16px;
    text-align: center;
  }
  .hud .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
  }
  .hud .value {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
  }
  .board-wrap {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 8px;
    backdrop-filter: blur(6px);
  }
  canvas#board {
    display: block;
    border-radius: 8px;
    background: rgba(0,0,0,0.35);
    touch-action: manipulation;
  }
  .overlay {
    position: absolute;
    inset: 8px;
    background: rgba(10, 8, 30, 0.85);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 16px;
  }
  .overlay.hide { display: none; }
  .overlay h2 { margin: 0; font-size: 22px; color: var(--accent); }
  .overlay p { margin: 0; color: var(--text-dim); font-size: 13px; max-width: 230px; }
  button {
    appearance: none;
    border: 1px solid var(--card-border);
    background: rgba(255,255,255,0.08);
    color: var(--text);
    padding: 9px 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { transform: scale(0.96); }
  .hint {
    margin-top: 16px;
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
  }
  footer { margin-top: 16px; font-size: 12px; color: var(--text-dim); }
  footer a { color: var(--accent); text-decoration: none; }
</style>
<style id="fullscreen-override">
  html, body { height: 100dvh !important; overflow: hidden !important; }
  body { padding: 6px !important; align-items: stretch !important; }
  .board-wrap { flex: 1 1 auto !important; width: 100% !important; max-width: none !important; min-height: 0 !important; border-radius: 0 !important; }
  canvas#board { width: 100% !important; height: 100% !important; }
</style>
</head>
<body>
  <h1>Dart Throw</h1>

  <div class="hud">
    <div class="panel"><div class="label">Darts Left</div><div class="value" id="darts">5</div></div>
    <div class="panel"><div class="label">Score</div><div class="value" id="score">0</div></div>
    <div class="panel"><div class="label">Best</div><div class="value" id="best">0</div></div>
  </div>

  <div class="board-wrap">
    <canvas id="board" width="320" height="460"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">Dart Throw</h2>
      <p id="overlaySub">Watch the crosshair move over the board. Tap when it's where you want to throw — 5 darts, land dead center for a Bullseye worth 100.</p>
      <button id="overlayBtn">Start</button>
    </div>
  </div>

  <p class="hint">Tap the board or press Space to throw</p>
  <footer>Served from <a href="/">mcp-info-server</a></footer>

<script>
(function () {
  const W = 320, H = 460;
  const cx = W / 2, cy = 190, R = 115;
  const launchX = W / 2, launchY = H - 30;
  const TOTAL_DARTS = 5;
  const FLIGHT_MS = 220;

  const RINGS = [
    { r: 0.08, pts: 100, color: '#f5c518', label: 'BULLSEYE!' },
    { r: 0.22, pts: 50,  color: '#f1faee', label: 'Great throw! +50' },
    { r: 0.45, pts: 30,  color: '#e63946', label: 'Nice! +30' },
    { r: 0.68, pts: 20,  color: '#f1faee', label: '+20' },
    { r: 1.00, pts: 10,  color: '#e63946', label: '+10' },
  ];

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const dartsEl = document.getElementById('darts');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const overlayBtn = document.getElementById('overlayBtn');

  const BEST_KEY = 'dartthrow_best_score';
  let best = Number(localStorageSafeGet(BEST_KEY)) || 0;
  bestEl.textContent = best;

  function localStorageSafeGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function localStorageSafeSet(key, val) {
    try { localStorage.setItem(key, val); } catch (e) { /* ignore */ }
  }
  function easeOut(t) { return 1 - (1 - t) * (1 - t); }

  let dartsLeft, score, running, gameOver;
  let reticleT, flying, toast, rafId, lastFrameTime;

  function reset() {
    dartsLeft = TOTAL_DARTS;
    score = 0;
    gameOver = false;
    reticleT = 0;
    flying = null;
    toast = null;
    dartsEl.textContent = dartsLeft;
    scoreEl.textContent = score;
  }

  function start() {
    reset();
    running = true;
    overlay.classList.add('hide');
    lastFrameTime = performance.now();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  function currentReticle() {
    const throwsSoFar = TOTAL_DARTS - dartsLeft;
    const speed = 1.5 + throwsSoFar * 0.22;
    const ampX = R * 1.05;
    const ampY = R * 0.9;
    const x = cx + Math.sin(reticleT * speed) * ampX;
    const y = cy + Math.sin(reticleT * speed * 1.35 + 0.7) * ampY;
    return { x, y };
  }

  function fire() {
    if (!running || gameOver || flying || dartsLeft <= 0) return;
    const target = currentReticle();
    flying = { start: performance.now(), progress: 0, targetX: target.x, targetY: target.y };
  }

  function resolveThrow() {
    const dx = flying.targetX - cx;
    const dy = flying.targetY - cy;
    const dist = Math.sqrt(dx * dx + dy * dy) / R; // normalized 0..1+

    let pts = 0, msg = 'Miss!';
    for (const ring of RINGS) {
      if (dist <= ring.r) {
        pts = ring.pts;
        msg = ring.label;
        break;
      }
    }

    score += pts;
    scoreEl.textContent = score;
    dartsLeft--;
    dartsEl.textContent = dartsLeft;
    toast = { text: msg, start: performance.now(), landX: flying.targetX, landY: flying.targetY };
    flying = null;

    if (dartsLeft <= 0) {
      setTimeout(endGame, 650);
    }
  }

  function endGame() {
    gameOver = true;
    running = false;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorageSafeSet(BEST_KEY, best);
    }
    overlayTitle.textContent = 'Final Score: ' + score;
    overlaySub.textContent = score >= 400 ? 'Incredible aim!' : score >= 250 ? 'Solid round!' : 'Give it another go.';
    overlayBtn.textContent = 'Play Again';
    overlay.classList.remove('hide');
  }

  function loop(now) {
    if (!running) return;
    const dt = Math.min((now - lastFrameTime) / 1000, 0.05);
    lastFrameTime = now;

    if (!flying && dartsLeft > 0) {
      reticleT += dt;
    }

    if (flying) {
      flying.progress = Math.min((now - flying.start) / FLIGHT_MS, 1);
      if (flying.progress >= 1) resolveThrow();
    }

    draw(now);
    rafId = requestAnimationFrame(loop);
  }

  function draw(now) {
    ctx.clearRect(0, 0, W, H);

    // dartboard rings, drawn outer to inner
    for (let i = RINGS.length - 1; i >= 0; i--) {
      ctx.beginPath();
      ctx.arc(cx, cy, RINGS[i].r * R, 0, Math.PI * 2);
      ctx.fillStyle = RINGS[i].color;
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#1a1a1a';
    ctx.stroke();

    // reticle (only while aiming, not mid-flight)
    if (running && !gameOver && !flying && dartsLeft > 0) {
      const rt = currentReticle();
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(rt.x - 10, rt.y);
      ctx.lineTo(rt.x + 10, rt.y);
      ctx.moveTo(rt.x, rt.y - 10);
      ctx.lineTo(rt.x, rt.y + 10);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(rt.x, rt.y, 6, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(125,211,252,0.9)';
      ctx.stroke();
    }

    // flying dart
    if (flying) {
      const t = easeOut(flying.progress);
      const x = launchX + (flying.targetX - launchX) * t;
      const y = launchY + (flying.targetY - launchY) * t;
      drawDart(x, y);
    } else if (running && !gameOver && dartsLeft > 0) {
      drawDart(launchX, launchY);
    }

    // toast message
    if (toast) {
      const age = (now - toast.start) / 1000;
      if (age < 1.1) {
        const alpha = age < 0.8 ? 1 : 1 - (age - 0.8) / 0.3;
        const rise = age * 24;
        ctx.globalAlpha = Math.max(0, alpha);
        ctx.font = 'bold 16px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = 'rgba(0,0,0,0.6)';
        ctx.lineWidth = 3;
        const ty = Math.max(20, toast.landY - 18 - rise);
        ctx.strokeText(toast.text, toast.landX, ty);
        ctx.fillText(toast.text, toast.landX, ty);
        ctx.globalAlpha = 1;
      } else {
        toast = null;
      }
    }
  }

  function drawDart(x, y) {
    const len = 24;
    ctx.strokeStyle = '#a78bfa';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(x, y + len);
    ctx.lineTo(x, y);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - 5, y + 9);
    ctx.lineTo(x + 5, y + 9);
    ctx.closePath();
    ctx.fillStyle = '#a78bfa';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x, y + len, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#f472b6';
    ctx.fill();
  }

  overlayBtn.addEventListener('click', start);
  canvas.addEventListener('click', fire);
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); fire(); }, { passive: false });

  document.addEventListener('keydown', (e) => {
    if (e.key === ' ') {
      e.preventDefault();
      fire();
    }
  });

  running = false;
  gameOver = false;
  reticleT = 0;
  dartsLeft = TOTAL_DARTS;
  draw(performance.now());
})();
</script>
</body>
</html>
