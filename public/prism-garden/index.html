<style>
  :root { --ink: #f3efff; --muted: #c7c0e4; --dim: #8e86b0; --glass: rgba(16, 12, 40, 0.5); --line: rgba(200, 190, 255, 0.2); --gold: #f6d68a; --display: "Cinzel Decorative", Georgia, serif; --serif: "Cormorant Garamond", Georgia, serif; --ui: "Outfit", system-ui, sans-serif; }

  .card { position: relative; height: 104px; border-radius: 14px; padding: 12px; text-align: left; display: flex; flex-direction: column; justify-content: flex-end; background: radial-gradient(circle at 70% 20%, rgba(140, 180, 255, .2), transparent 60%), rgba(255, 255, 255, .04); border: 1px solid var(--line); transition: transform .15s, border-color .15s; }
  .card:hover:not([disabled]) { transform: translateY(-2px); border-color: rgba(255, 224, 138, .6); }

  .card .num { position: absolute; top: 8px; left: 12px; font-family: var(--display); font-size: 20px; color: var(--gold); opacity: .8; }

  #tray small { color: var(--dim); font-size: 11px; line-height: 1.4; }
  .ico { width: 22px; height: 22px; border-radius: 50%; border: 3px solid #d9a066; background: linear-gradient(135deg, #fff, #aab); } .ico.split { background: linear-gradient(135deg, rgba(160, 200, 255, .7), rgba(255, 255, 255, .2)); }

  .mcard { border-radius: 22px; padding: 28px 36px; text-align: center; min-width: min(360px, 92vw); max-width: 92vw; }

  #w-moves { color: var(--muted); }
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 12px 0; color: var(--muted); }
  input[type=range] { accent-color: #c9a7ff; width: 160px; }
  @media (max-width: 640px) { #top { gap: 12px; padding: 6px 12px; } #h-name { font-size: 18px; } #h-grove { display: none; } #tray { max-width: 160px; } }
</style>

</div>
