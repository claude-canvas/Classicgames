<style>
  :root { --ink: #eef6ff; --muted: #b9c8dc; --dim: #7f91a8; --glass: rgba(10, 18, 34, 0.5); --line: rgba(190, 225, 255, 0.18); --aur: #5ef2b0; --vio: #a98bff; --red: #e8392a; --yel: #f6c21e; --display: "Marcellus SC", Georgia, serif; --ui: "Outfit", system-ui, sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050a16; color: var(--ink); font-family: var(--ui); user-select: none; -webkit-user-select: none; touch-action: none; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: ew-resize; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  kbd { font-family: var(--ui); font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.08); margin: 0 1px; }
  .glass { background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); box-shadow: 0 18px 60px rgba(0, 4, 14, 0.5); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 26px; border-radius: 999px; font-weight: 600; font-size: 15px; letter-spacing: 0.06em; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06); transition: background .15s, transform .15s; }
  .btn:hover { background: rgba(255, 255, 255, 0.14); transform: translateY(-1px); }
  .btn.pri { border: 0; color: #04140f; background: linear-gradient(135deg, #7ff7c4, #5fd3f5 55%, #a98bff); box-shadow: 0 10px 34px rgba(94, 242, 176, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.5); }
  .btn.lg { height: 56px; padding: 0 40px; font-size: 17px; }
  .kicker { font-size: 11px; letter-spacing: 0.42em; color: var(--aur); text-transform: uppercase; font-weight: 600; }

  #loading { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: #050a16; transition: opacity .8s; font-family: var(--display); letter-spacing: .3em; color: var(--muted); }
  #loading.out { opacity: 0; pointer-events: none; }

  /* title */
  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 16px 9vh; text-align: center; pointer-events: none; background: radial-gradient(ellipse at 50% 100%, rgba(3, 8, 20, 0.75), transparent 60%); }
  #title > * { pointer-events: auto; }
  .logo { font-family: var(--display); font-size: clamp(54px, 11vw, 132px); line-height: .9; letter-spacing: .04em; margin: 10px 0 6px; background: linear-gradient(180deg, #ffffff 10%, #bfe9ff 55%, #7ff7c4 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 30px rgba(127, 247, 196, 0.35)); }
  .tag { color: var(--muted); font-size: 16px; max-width: 520px; line-height: 1.5; margin: 0 0 26px; font-weight: 300; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .seg { display: inline-flex; border-radius: 999px; border: 1px solid var(--line); overflow: hidden; background: rgba(255, 255, 255, 0.04); }
  .seg button { padding: 9px 16px; font-size: 13px; color: var(--muted); letter-spacing: .05em; }
  .seg button.on { background: rgba(127, 247, 196, 0.18); color: #fff; }
  #t-diff { margin: 18px 0 8px; }
  #t-rec { color: var(--dim); font-size: 13px; margin-top: 10px; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  #scorebox { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); border-radius: 16px; padding: 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #board { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  #board th { font-weight: 400; color: var(--dim); font-size: 10px; padding: 0 7px; }
  #board td { padding: 2px 7px; text-align: center; min-width: 22px; color: var(--muted); }
  #board .cur { color: #fff; background: rgba(255, 255, 255, 0.07); }
  #board .nm { text-align: left; white-space: nowrap; color: var(--ink); font-weight: 600; }
  #board .nm i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: 0; }
  #board .t0 .nm i { background: var(--red); box-shadow: 0 0 8px var(--red); } #board .t1 .nm i { background: var(--yel); box-shadow: 0 0 8px var(--yel); }
  #board .nm b { color: var(--aur); margin-left: 6px; font-weight: 400; }
  #board .tot { font-weight: 700; color: #fff; font-size: 15px; border-left: 1px solid var(--line); }
  .turn { font-size: 11px; letter-spacing: .3em; text-transform: uppercase; font-weight: 600; }
  .turn.t0 { color: #ff8a7e; } .turn.t1 { color: #ffd760; }
  .left { position: absolute; top: 18px; display: flex; gap: 5px; }
  .left i { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #9aa0aa, #4a4e57); position: relative; box-shadow: 0 2px 6px rgba(0, 0, 0, .5); }
  .left i::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; }
  #left0 { left: 16px; } #left0 i::after { background: var(--red); }
  #left1 { right: 64px; } #left1 i::after { background: var(--yel); }
  .left i.used { opacity: .18; }
  #b-pause { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 50%; font-size: 15px; }
  #mini { position: absolute; right: 16px; top: 64px; width: 120px; height: 150px; border-radius: 14px; }
  #prompt { position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); color: var(--muted); font-size: 13px; text-align: center; width: min(92vw, 640px); text-shadow: 0 2px 10px #000; pointer-events: none; }
  #controls { position: absolute; left: 16px; bottom: 60px; display: flex; flex-direction: column; gap: 10px; transition: opacity .3s; }
  #controls.off { opacity: .25; pointer-events: none; }
  .curl { display: flex; gap: 8px; }
  .curl button { width: 92px; height: 54px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 22px; line-height: 1; }
  .curl button small { font-size: 10px; letter-spacing: .15em; color: var(--dim); margin-top: 4px; }
  .curl button.on { background: rgba(127, 247, 196, 0.16); border-color: rgba(127, 247, 196, 0.6); }
  #b-throw { width: 192px; height: 58px; border-radius: 16px; font-weight: 700; letter-spacing: .25em; font-size: 15px; }
  #meter { position: absolute; right: 24px; bottom: 70px; width: 46px; height: min(46vh, 340px); border-radius: 23px; padding: 5px; opacity: 0; transition: opacity .3s; }
  #meter.on { opacity: 1; }
  #m-track { position: relative; width: 100%; height: 100%; border-radius: 18px; overflow: hidden; background: linear-gradient(0deg, rgba(120, 140, 170, .25) 0 15%, rgba(94, 200, 255, .22) 15% 40%, rgba(127, 247, 196, .34) 40% 66%, rgba(255, 210, 120, .26) 66% 76%, rgba(255, 110, 90, .3) 76% 100%); }
  #m-fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: linear-gradient(0deg, rgba(255, 255, 255, .25), rgba(255, 255, 255, .85)); box-shadow: 0 0 18px #fff; border-top: 2px solid #fff; }
  .mz { position: absolute; right: 54px; font-size: 9px; letter-spacing: .2em; color: var(--dim); transform: translateY(50%); white-space: nowrap; }
  #m-zone { position: absolute; right: 0; left: 0; top: -26px; text-align: center; font-weight: 700; font-size: 11px; letter-spacing: .2em; color: #fff; }
  #b-sweep { position: absolute; right: 24px; bottom: 70px; width: 120px; height: 120px; border-radius: 50%; font-weight: 700; letter-spacing: .25em; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .1s; }
  #b-sweep.show { opacity: 1; pointer-events: auto; }
  #b-sweep.on { transform: scale(.94); background: rgba(127, 247, 196, .25); border-color: var(--aur); }
  #sweepfx { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .2s; box-shadow: inset 0 0 120px rgba(127, 247, 196, .18); }
  #toast { position: absolute; top: 30%; left: 50%; transform: translate(-50%, 10px); font-family: var(--display); font-size: 22px; letter-spacing: .12em; opacity: 0; transition: opacity .3s, transform .3s; text-shadow: 0 2px 16px #000; pointer-events: none; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #banner { position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%) scale(.96); text-align: center; padding: 22px 44px; border-radius: 22px; opacity: 0; transition: opacity .4s, transform .4s; pointer-events: none; }
  #banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; cursor: pointer; }
  #ban-t { font-family: var(--display); font-size: 40px; letter-spacing: .06em; }
  #ban-s { color: var(--muted); margin-top: 4px; }

  /* modals */
  .modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(2, 6, 16, .55); z-index: 20; padding: 16px; }
  .card { border-radius: 24px; padding: 30px 34px; text-align: center; min-width: min(360px, 92vw); max-width: 92vw; }
  .card h2 { font-family: var(--display); font-weight: 400; font-size: 34px; margin: 8px 0 14px; }
  .card .col { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .big { font-family: var(--display); font-size: 64px; margin: 6px 0; background: linear-gradient(180deg, #fff, #9fe8ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 12px 0; text-align: left; color: var(--muted); }
  input[type=range] { accent-color: #7ff7c4; width: 160px; }

  @media (max-width: 640px) {
    .curl button { width: 70px; height: 48px; } #b-throw { width: 148px; }
    #mini { width: 92px; height: 116px; top: 100px; right: 10px; }
    #left1 { right: 58px; top: 60px; } #left0 { top: 60px; }
    .mz { display: none; }
    #board td, #board th { padding: 1px 4px; }
  }
</style>

</div>

  <button id="b-pause" class="glass" aria-label="Pause">❚❚</button>

  <div id="controls">
    <div class="curl"><button id="b-out" class="glass">↺<small>OUT · Q</small></button><button id="b-in" class="glass">↻<small>IN · E</small></button></div>

  </div>

    <span class="mz" style="bottom:7%">HOG</span><span class="mz" style="bottom:27%">GUARD</span><span class="mz" style="bottom:53%">DRAW</span><span class="mz" style="bottom:71%">HEAVY</span><span class="mz" style="bottom:88%">TAKEOUT</span>

  <div id="toast"></div>

</div>
<div id="sweepfx"></div>

<div class="modal hidden" id="m-pause"><div class="card glass"><div class="kicker">Paused</div><h2>Frost Stone</h2>
  <div class="col"><button class="btn pri" id="p-resume">Resume</button><button class="btn" id="p-restart">Restart match</button><button class="btn" id="p-set">Settings</button><button class="btn" id="p-title">Quit to title</button></div></div></div>

  <div class="set-row">Sound <input type="range" id="st-vol" min="0" max="100"></div>
  <div class="set-row">Music <input type="range" id="st-mus" min="0" max="100"></div>
  <div class="set-row">Aim guide <div class="seg" id="st-guide"><button data-v="off">Off</button><button data-v="curl">Curl</button><button data-v="full">Full</button></div></div>
  <div class="col"><button class="btn pri" id="st-close">Done</button></div></div></div>

<script type="module" src="./main.js"></script>
