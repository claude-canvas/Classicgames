<style>
  :root { --ink: #fff6ec; --muted: #f0cdb4; --dim: #b89482; --glass: rgba(40, 16, 20, 0.45); --line: rgba(255, 210, 170, 0.25); --cy: #ffb347; --mg: #ff4f6d; --hud: "Orbitron", sans-serif; --ui: "Outfit", system-ui, sans-serif; }
