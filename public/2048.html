<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>2048</title>
<style>
  :root { --bg-1:#0f0c29; --bg-2:#302b63; --bg-3:#24243e; --accent:#7dd3fc; --accent-2:#a78bfa; --card-bg:rgba(255,255,255,0.06); --card-border:rgba(255,255,255,0.14); --text:#eef2ff; --text-dim:#b8c0e0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overscroll-behavior:none; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif; background:linear-gradient(135deg,var(--bg-1),var(--bg-2) 50%,var(--bg-3)); color:var(--text); display:flex; flex-direction:column; align-items:center; padding:18px 14px 24px; min-height:100%; user-select:none; }
  h1 { font-size:clamp(24px,6vw,32px); margin:0 0 12px; background:linear-gradient(90deg,#fff,var(--accent) 60%,var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hud { display:flex; gap:14px; margin-bottom:14px; }
  .hud .panel { background:var(--card-bg); border:1px solid var(--card-border); border-radius:12px; padding:8px 18px; text-align:center; }
  .hud .label { font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); }
  .hud .value { font-size:20px; font-weight:700; color:var(--accent); }
  .board-wrap { position:relative; background:rgba(255,255,255,0.06); border:1px solid var(--card-border); border-radius:16px; padding:8px; touch-action:none; }
  .grid { position:relative; width:300px; height:300px; display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,1fr); gap:8px; }
  .bg-cell { background:rgba(0,0,0,0.28); border-radius:8px; }
  .tile { position:absolute; width:calc(25% - 6px); height:calc(25% - 6px); border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:22px; transition:left 0.1s ease, top 0.1s ease, transform 0.1s ease; }
  .overlay { position:absolute; inset:8px; background:rgba(10,8,30,0.85); border-radius:8px; display:none; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:16px; }
  .overlay.show { display:flex; }
  .overlay h2 { margin:0; font-size:22px; color:var(--accent); }
  .overlay p { margin:0; color:var(--text-dim); font-size:13px; }
  button { appearance:none; border:1px solid var(--card-border); background:rgba(255,255,255,0.08); color:var(--text); padding:9px 18px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; margin-top:14px; }
  .hint { margin-top:16px; font-size:12px; color:var(--text-dim); text-align:center; max-width:300px; }
  footer { margin-top:20px; font-size:12px; color:var(--text-dim); }
  footer a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
  <h1>2048</h1>
  <div class="hud">
    <div class="panel"><div class="label">Score</div><div class="value" id="score">0</div></div>
    <div class="panel"><div class="label">Best</div><div class="value" id="best">0</div></div>
  </div>
  <div class="board-wrap">
    <div class="grid" id="grid">
      <div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div>
      <div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div>
      <div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div>
      <div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div><div class="bg-cell"></div>
    </div>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">Game Over</h2>
      <p id="overlaySub">Score: 0</p>
      <button id="overlayBtn">Try Again</button>
    </div>
  </div>
  <button id="newGameBtn" style="margin-top:16px;">New Game</button>
  <p class="hint">Swipe, or use arrow keys, to combine matching tiles until you reach 2048.</p>
  <footer>Served from <a href="/">mcp-info-server</a> · <a href="/games.html">All games</a></footer>
<script>
(function () {
  const SIZE = 4;
  const grid = document.getElementById('grid');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const overlayBtn = document.getElementById('overlayBtn');
  const newGameBtn = document.getElementById('newGameBtn');

  const COLORS = {
    2: '#3f3d6d', 4: '#4b4880', 8: '#f9a8d4', 16: '#f472b6',
    32: '#fb923c', 64: '#f97316', 128: '#fde68a', 256: '#fcd34d',
    512: '#a7f3d0', 1024: '#7dd3fc', 2048: '#a78bfa'
  };

  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  let board, score, best;

  function newBoard() {
    board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    score = 0;
    addRandomTile();
    addRandomTile();
    render();
    overlay.classList.remove('show');
  }

  function addRandomTile() {
    const empty = [];
    for (let y = 0; y < SIZE; y++)
      for (let x = 0; x < SIZE; x++)
        if (board[y][x] === 0) empty.push({ x, y });
    if (empty.length === 0) return;
    const spot = empty[Math.floor(Math.random() * empty.length)];
    board[spot.y][spot.x] = Math.random() < 0.9 ? 2 : 4;
  }

  function render() {
    grid.querySelectorAll('.tile').forEach(t => t.remove());
    const cellSize = 300 / SIZE;
    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        const val = board[y][x];
        if (!val) continue;
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.textContent = val;
        tile.style.left = (x * cellSize) + 'px';
        tile.style.top = (y * cellSize) + 'px';
        tile.style.background = COLORS[val] || '#6366f1';
        tile.style.color = val <= 4 ? '#eef2ff' : '#1e1b3a';
        tile.style.fontSize = val >= 1024 ? '16px' : '22px';
        grid.appendChild(tile);
      }
    }
    scoreEl.textContent = score;
    best = Math.max(best, score);
    bestEl.textContent = best;
    safeSet('game2048_best', best);
  }

  function slideLine(line) {
    let vals = line.filter(v => v !== 0);
    let gained = 0;
    for (let i = 0; i < vals.length - 1; i++) {
      if (vals[i] === vals[i + 1]) {
        vals[i] *= 2;
        gained += vals[i];
        vals.splice(i + 1, 1);
      }
    }
    while (vals.length < SIZE) vals.push(0);
    return { vals, gained };
  }

  function move(dir) {
    let moved = false;
    let gainedTotal = 0;
    const before = JSON.stringify(board);

    if (dir === 'left' || dir === 'right') {
      for (let y = 0; y < SIZE; y++) {
        let row = board[y];
        if (dir === 'right') row = row.slice().reverse();
        const { vals, gained } = slideLine(row);
        gainedTotal += gained;
        board[y] = dir === 'right' ? vals.slice().reverse() : vals;
      }
    } else {
      for (let x = 0; x < SIZE; x++) {
        let col = board.map(r => r[x]);
        if (dir === 'down') col = col.slice().reverse();
        const { vals, gained } = slideLine(col);
        gainedTotal += gained;
        const finalCol = dir === 'down' ? vals.slice().reverse() : vals;
        for (let y = 0; y < SIZE; y++) board[y][x] = finalCol[y];
      }
    }

    moved = JSON.stringify(board) !== before;
    if (moved) {
      score += gainedTotal;
      addRandomTile();
      render();
      checkGameOver();
    }
  }

  function canMove() {
    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        if (board[y][x] === 0) return true;
        if (x < SIZE - 1 && board[y][x] === board[y][x + 1]) return true;
        if (y < SIZE - 1 && board[y][x] === board[y + 1][x]) return true;
      }
    }
    return false;
  }

  function checkGameOver() {
    if (!canMove()) {
      overlayTitle.textContent = 'Game Over';
      overlaySub.textContent = 'Score: ' + score;
      overlayBtn.textContent = 'Try Again';
      overlay.classList.add('show');
    }
  }

  document.addEventListener('keydown', (e) => {
    const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
    if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
  });

  let touchStartX = 0, touchStartY = 0;
  grid.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  grid.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
  }, { passive: true });

  overlayBtn.addEventListener('click', newBoard);
  newGameBtn.addEventListener('click', newBoard);

  best = Number(safeGet('game2048_best')) || 0;
  newBoard();
})();
</script>
</body>
</html>
