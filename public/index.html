<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Game Arcade</title>
<meta name="description" content="A gallery of classic and 3D browser games. Every thumbnail is a real frame captured mid-game." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0a14;
    --bg-glow-1: rgba(124, 92, 255, 0.22);
    --bg-glow-2: rgba(0, 200, 255, 0.14);
    --text: #f3f1ff;
    --text-dim: #a9a5c4;
    --line: rgba(255, 255, 255, 0.09);
    --chip: rgba(255, 255, 255, 0.06);
    --chip-on: #f3f1ff;
    --accent: #8b7bff;
    --accent-2: #3ad6ff;
    --gutter: 10px;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; color: var(--text); background: var(--bg);
    font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-image:
      radial-gradient(900px 500px at 10% -10%, var(--bg-glow-1), transparent 70%),
      radial-gradient(800px 500px at 100% 0%, var(--bg-glow-2), transparent 70%);
    background-repeat: no-repeat;
  }
  .wrap { max-width: 1480px; margin: 0 auto; padding: 44px 24px 56px; }

  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px 32px; margin-bottom: 26px; }
  .brand .eyebrow { font: 600 12px/1 Inter, sans-serif; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent-2); margin-bottom: 12px; }
  h1 {
    font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 700; font-size: clamp(36px, 6vw, 64px); line-height: 0.95; margin: 0; letter-spacing: -0.02em;
    background: linear-gradient(100deg, #fff 30%, #c9c0ff 60%, var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: var(--text-dim); font-size: 15px; margin: 12px 0 0; max-width: 520px; line-height: 1.5; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,0.03); }
  .chip {
    font: 500 13px/1 Inter, sans-serif; color: var(--text-dim); background: transparent; border: 0; border-radius: 999px;
    padding: 9px 14px; cursor: pointer; transition: color .15s, background .15s;
  }
  .chip:hover { color: var(--text); }
  .chip[aria-pressed="true"] { background: var(--chip-on); color: #12101f; }
  .chip .n { opacity: 0.55; margin-left: 4px; font-size: 11px; }
  .search {
    font: 500 14px/1 Inter, sans-serif; color: var(--text); background: var(--chip); border: 1px solid var(--line); border-radius: 999px;
    padding: 11px 16px; width: 200px; outline: none; transition: border-color .15s, width .2s;
  }
  .search::placeholder { color: var(--text-dim); }
  .search:focus { border-color: var(--accent); width: 240px; }

  /* Gallery: explicit grid placement computed in JS so tiles pack with no holes */
  .gallery { display: grid; gap: var(--gutter); grid-template-columns: repeat(var(--cols, 6), 1fr); grid-auto-rows: var(--row, 180px); grid-auto-flow: dense; }
  .tile {
    position: relative; overflow: hidden; border-radius: var(--radius); background: #17152a; color: var(--text); text-decoration: none;
    isolation: isolate; outline: none; box-shadow: 0 0 0 1px var(--line) inset;
  }
  .gallery.intro .tile { animation: rise .5s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 18ms); }
  .tile img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; z-index: -2;
    transition: transform .6s cubic-bezier(.2,.7,.2,1), filter .4s;
  }
  .tile::before { /* readability gradient */
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(to top, rgba(8,6,18,0.92) 0%, rgba(8,6,18,0.55) 26%, rgba(8,6,18,0) 55%);
    transition: opacity .3s;
  }
  .tile::after { /* hover ring */
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: 0 0 0 2px transparent inset; transition: box-shadow .2s;
  }
  .tile:hover img, .tile:focus-visible img { transform: scale(1.06); filter: saturate(1.15) brightness(1.05); }
  .tile:hover::after, .tile:focus-visible::after { box-shadow: 0 0 0 2px var(--accent-2) inset; }
  .meta { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 14px; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
  .meta .txt { min-width: 0; }
  .name { font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 700; font-size: 17px; line-height: 1.15; letter-spacing: -0.01em; text-shadow: 0 1px 12px rgba(0,0,0,.5); }
  .desc {
    font-size: 12.5px; color: #d6d2ee; margin-top: 4px; line-height: 1.35;
    max-height: 0; opacity: 0; overflow: hidden; transition: max-height .3s, opacity .3s;
  }
  .tile:hover .desc, .tile:focus-visible .desc, .tile.hero .desc { max-height: 3em; opacity: 1; }
  .tile.hero .name { font-size: clamp(22px, 2.2vw, 30px); }
  .tile.hero .desc { font-size: 14px; }
  .play {
    flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: #12101f;
    transform: translateY(8px) scale(.85); opacity: 0; transition: transform .25s, opacity .25s;
  }
  .play svg { width: 14px; height: 14px; margin-left: 2px; }
  .tile:hover .play, .tile:focus-visible .play { transform: none; opacity: 1; }
  .badge {
    position: absolute; top: 12px; left: 12px; font: 600 10.5px/1 Inter, sans-serif; letter-spacing: 0.12em; text-transform: uppercase;
    padding: 6px 9px; border-radius: 999px; background: rgba(10, 8, 22, 0.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.14);
  }
  .badge.feat { background: linear-gradient(90deg, var(--accent), var(--accent-2)); border: 0; color: #fff; }

  .filler {
    border-radius: var(--radius); box-shadow: 0 0 0 1px var(--line) inset;
    background:
      radial-gradient(120% 120% at 0% 0%, rgba(139,123,255,0.25), transparent 60%),
      radial-gradient(120% 120% at 100% 100%, rgba(58,214,255,0.18), transparent 60%),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0 8px, transparent 8px 16px), #13111f;
  }
  .empty { grid-column: 1 / -1; color: var(--text-dim); text-align: center; padding: 60px 0; }

  footer { margin-top: 36px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; color: var(--text-dim); font-size: 13px; }
  footer a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--line); }
  footer a:hover { border-color: var(--accent-2); }

  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
  @media (max-width: 720px) {
    .wrap { padding: 28px 16px 40px; }
    :root { --gutter: 8px; --radius: 12px; }
    .search, .search:focus { width: 100%; }
    .controls { width: 100%; }
    .chips { overflow-x: auto; flex-wrap: nowrap; max-width: 100%; }
    .chip { white-space: nowrap; }
    .name { font-size: 15px; }
    .meta { padding: 10px 12px; }
    .play { display: none; }
    .badge { top: 8px; left: 8px; }
  }
  @media (hover: none) { .desc { max-height: 3em; opacity: 1; } .tile:not(.hero) .desc { display: none; } }
  @media (prefers-reduced-motion: reduce) { .tile, .tile img, .play, .desc { animation: none; transition: none; } }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="eyebrow">Classic Games</div>
        <h1>Game Arcade</h1>
        <p class="sub"><span id="count">39</span> games, from pocket classics to full 3D worlds. Every picture here is a real frame captured mid-game.</p>
      </div>
      <div class="controls">
        <div class="chips" role="group" aria-label="Filter games" id="chips"></div>
        <input class="search" id="search" type="search" placeholder="Search games" aria-label="Search games" autocomplete="off" />
      </div>
    </header>

    <main class="gallery" id="gallery" aria-live="polite"></main>

    <footer>
      <span>Click any tile to play. Games run right in your browser.</span>
      <a href="https://github.com/claude-canvas/Classicgames">Source on GitHub</a>
    </footer>
  </div>

<script>
// shape: hero = feature tile, wide = landscape, tall = portrait, sq = square
// tags: 3d | classic | puzzle (a game can have several)
const GAMES = [
  { id: 'minecraft',     name: 'Minecraft',         desc: '3D voxel world with redstone and an AI companion', url: '/minecraft/index.html', shape: 'hero', tags: ['3d'] },
  { id: 'tetris',        name: 'Tetris',            desc: 'Stack and clear lines',                url: '/tetris.html',        shape: 'tall', tags: ['classic', 'puzzle'] },
  { id: '2048',          name: '2048',              desc: 'Merge tiles to reach 2048',            url: '/2048.html',          shape: 'sq',   tags: ['classic', 'puzzle'] },
  { id: 'night-market',  name: 'Night Market',      desc: 'Run a cosy street-food market, one night at a time', url: '/night-market/', shape: 'hero', tags: ['3d'] },
  { id: 'snake',         name: 'Snake',             desc: "Grow, don't crash",                    url: '/snake.html',         shape: 'wide', tags: ['classic'] },
  { id: 'flappybird',    name: 'Flappy Bird',       desc: 'Tap to flap through the pipes',        url: '/flappybird.html',    shape: 'sq',   tags: ['classic'] },
  { id: 'chroma-drop',   name: 'Chroma Drop',       desc: 'Bounce down a spinning helix tower',   url: '/chroma-drop/',       shape: 'tall', tags: ['3d'] },
  { id: 'neon-rush',     name: 'Neon Rush',         desc: 'Synthwave lane runner',                url: '/neon-rush/',         shape: 'hero', tags: ['3d'] },
  { id: 'umbra',         name: 'Umbra',             desc: 'Turn the sculpture till the shadow fits', url: '/umbra/',          shape: 'sq',   tags: ['3d', 'puzzle'] },
  { id: 'pong',          name: 'Pong',              desc: 'You vs the CPU',                       url: '/pong.html',          shape: 'sq', tags: ['classic'] },
  { id: 'memory',        name: 'Memory Match',      desc: 'Find all the pairs',                   url: '/memory.html',        shape: 'sq',   tags: ['classic', 'puzzle'] },
  { id: 'aegis',         name: 'Aegis',             desc: 'Guard a 3D planet from meteors',       url: '/aegis.html',         shape: 'wide', tags: ['3d'] },
  { id: 'stratos',       name: 'Stratos',           desc: 'Stack glass slabs into the sky',       url: '/stratos/',           shape: 'tall', tags: ['3d'] },
  { id: 'tictactoe',     name: 'Tic Tac Toe',       desc: '2 players, one board',                 url: '/tictactoe.html',     shape: 'sq',   tags: ['classic', 'puzzle'] },
  { id: 'borealis',      name: 'Borealis',          desc: 'Glide under the aurora',               url: '/borealis.html',      shape: 'hero', tags: ['3d'] },
  { id: 'breakout',      name: 'Breakout',          desc: 'Clear every brick',                    url: '/breakout.html',      shape: 'sq', tags: ['classic'] },
  { id: 'minesweeper',   name: 'Minesweeper',       desc: 'Flag the mines',                       url: '/minesweeper.html',   shape: 'sq',   tags: ['classic', 'puzzle'] },
  { id: 'prism-rush',    name: 'Prism Rush',        desc: 'Endless neon highway runner',          url: '/prism-rush/',        shape: 'wide', tags: ['3d'] },
  { id: 'classicrace',   name: 'Classic Race',      desc: 'Dodge the traffic',                    url: '/classicrace.html',   shape: 'tall', tags: ['classic'] },
  { id: 'ripple',        name: 'Ripple',            desc: 'Steer a paper boat with pebbles',      url: '/ripple/',            shape: 'sq',   tags: ['3d', 'puzzle'] },
  { id: 'ludo',          name: 'Ludo',              desc: 'Roll, race, capture',                  url: '/ludo.html',          shape: 'sq',   tags: ['classic'] },
  { id: 'skyputt',       name: 'Skyputt',           desc: 'Mini golf across floating islands',    url: '/skyputt/',           shape: 'hero', tags: ['3d'] },
  { id: 'spaceinvaders', name: 'Space Invaders',    desc: 'Blast the alien fleet',                url: '/spaceinvaders.html', shape: 'wide', tags: ['classic'], pos: 'center 30%' },
  { id: 'whackamole',    name: 'Whack-a-Mole',      desc: 'Bop them before they hide',            url: '/whackamole.html',    shape: 'sq',   tags: ['classic'] },
  { id: 'vortex',        name: 'Vortex',            desc: '3D neon tunnel runner',                url: '/vortex.html',        shape: 'wide', tags: ['3d'] },
  { id: 'orbital',       name: 'Orbital',           desc: 'Place worlds, bend the path, reach the light', url: '/orbital/',   shape: 'sq',   tags: ['3d', 'puzzle'] },
  { id: 'simon',         name: 'Simon',             desc: 'Repeat the pattern',                   url: '/simon.html',         shape: 'wide', tags: ['classic', 'puzzle'] },
  { id: 'lumen-garden',  name: 'Lumen Garden',      desc: 'A little light goes a long way',       url: '/Lumen-Garden/',      shape: 'sq',   tags: ['3d', 'puzzle'] },
  { id: 'gearworks',     name: 'Gearworks',         desc: 'Steam-powered pinball',                url: '/gearworks/',         shape: 'hero', tags: ['3d'] },
  { id: 'dinorun',       name: 'Dino Run',          desc: 'Jump the cacti',                       url: '/dinorun.html',       shape: 'wide', tags: ['classic'], pos: 'center 80%' },
  { id: 'tessera',       name: 'Tessera',           desc: 'Grow a hex-tile island',               url: '/tessera/',           shape: 'sq',   tags: ['3d', 'puzzle'] },
  { id: 'dartthrow',     name: 'Dart Throw',        desc: 'Aim, tap, bullseye',                   url: '/dartthrow.html',     shape: 'wide', tags: ['classic'] },
  { id: 'rewind-heist',  name: 'Rewind Heist',      desc: 'A time-loop stealth heist',            url: '/rewind-heist/',      shape: 'wide', tags: ['3d', 'puzzle'] },
  { id: 'dartwheel',     name: 'Dart Wheel',        desc: "Land it, don't hit one",               url: '/dartwheel.html',     shape: 'wide', tags: ['classic'] },
  { id: 'starsling',     name: 'Starsling',         desc: 'Gravity slingshot puzzle',             url: '/starsling/',         shape: 'wide', tags: ['3d', 'puzzle'] },
  { id: 'meadow',        name: 'Meadowhop',         desc: '3D bunny meadow adventure',            url: '/meadow.html',        shape: 'wide', tags: ['3d'] },
  { id: 'raycaster',     name: 'Raycaster',         desc: '3D maze crawler',                      url: '/raycaster/index.html', shape: 'wide', tags: ['3d'] },
  { id: 'grass',         name: 'Grass in the Wind', desc: 'Windswept 3D grass field',             url: '/grass.html',         shape: 'wide', tags: ['3d'] },
  { id: 'grasswallpaper', name: 'Grass Wallpaper',  desc: 'Live grass wallpaper',                 url: '/grasswallpaper.html', shape: 'wide', tags: ['3d'] },
];

const FILTERS = [
  { key: 'all', label: 'All' },
  { key: '3d', label: '3D worlds' },
  { key: 'classic', label: 'Classics' },
  { key: 'puzzle', label: 'Puzzles' },
];

const gallery = document.getElementById('gallery');
const search = document.getElementById('search');
const chipsEl = document.getElementById('chips');
const PLAY_ICON = '<svg viewBox="0 0 12 14" aria-hidden="true"><path d="M0 0l12 7-12 7z" fill="currentColor"/></svg>';
let filter = 'all';

// ---- build the tiles once ----
const tiles = GAMES.map((g, i) => {
  const a = document.createElement('a');
  a.className = 'tile' + (g.shape === 'hero' ? ' hero' : '');
  a.href = g.url;
  a.setAttribute('aria-label', `${g.name}: ${g.desc}`);
  const badge = g.shape === 'hero' ? '<span class="badge feat">Featured</span>' : (g.tags.includes('3d') ? '<span class="badge">3D</span>' : '');
  a.innerHTML = `<img src="/thumbs/${g.id}.webp" alt=""${g.pos ? ` style="object-position:${g.pos}"` : ""} ${i > 11 ? 'loading="lazy"' : ''} decoding="async">${badge}
    <div class="meta"><div class="txt"><div class="name">${g.name}</div><div class="desc">${g.desc}</div></div><span class="play">${PLAY_ICON}</span></div>`;
  return { g, el: a };
});

// ---- filters ----
for (const f of FILTERS) {
  const b = document.createElement('button');
  b.className = 'chip'; b.type = 'button'; b.dataset.key = f.key;
  const n = f.key === 'all' ? GAMES.length : GAMES.filter(g => g.tags.includes(f.key)).length;
  b.innerHTML = `${f.label}<span class="n">${n}</span>`;
  b.setAttribute('aria-pressed', f.key === filter);
  b.onclick = () => { filter = f.key; chipsEl.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.key === filter)); render(); };
  chipsEl.appendChild(b);
}
search.addEventListener('input', render);

// ---- gap-free packing ----
function spanFor(shape, cols) {
  if (shape === 'hero') return cols >= 6 ? [3, 2] : [2, 2];
  if (shape === 'wide') return [Math.min(2, cols), 1];
  if (shape === 'tall') return [1, 2];
  return [1, 1];
}

function pack(list, cols) {
  const grid = [];                        // grid[r][c] = index of item or -1
  const free = (r, c) => c < cols && (!grid[r] || grid[r][c] === -1);
  const ensure = r => { while (grid.length <= r) grid.push(new Array(cols).fill(-1)); };
  const fits = (r, c, w, h) => { for (let y = r; y < r + h; y++) for (let x = c; x < c + w; x++) if (!free(y, x)) return false; return true; };
  const placed = [];                      // {item, r, c, w, h}
  const put = (item, r, c, w, h) => { ensure(r + h - 1); for (let y = r; y < r + h; y++) for (let x = c; x < c + w; x++) grid[y][x] = placed.length; placed.push({ item, r, c, w, h }); };

  const queue = list.slice();
  let r = 0, c = 0;
  const LOOKAHEAD = 6;                    // keep roughly to the curated order
  while (queue.length) {
    while (!free(r, c)) { c++; if (c >= cols) { c = 0; r++; } }
    let pick = -1;
    for (let k = 0; k < Math.min(LOOKAHEAD, queue.length) && pick < 0; k++) {
      const [w, h] = spanFor(queue[k].g.shape, cols);
      if (fits(r, c, w, h)) pick = k;
    }
    if (pick >= 0) { const it = queue.splice(pick, 1)[0]; const [w, h] = spanFor(it.g.shape, cols); put(it, r, c, w, h); }
    else {                                // nothing fits here: shrink the next item into the slot
      const it = queue.shift(); let [w, h] = spanFor(it.g.shape, cols);
      while (w > 1 && !fits(r, c, w, 1)) w--;
      while (h > 1 && !fits(r, c, w, h)) h--;
      put(it, r, c, w, h);
    }
  }

  // close the ragged bottom edge by stretching neighbours into empty cells
  const rows = grid.length;
  const holeAt = (y, x) => grid[y][x] === -1;
  let changed = true;
  while (changed) {
    changed = false;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      if (!holeAt(y, x)) continue;
      // 1) stretch the tile on the left to the right
      if (x > 0 && grid[y][x - 1] >= 0) {
        const p = placed[grid[y][x - 1]];
        if (p.c + p.w === x && rangeIsHole(p.r, p.r + p.h - 1, x, x)) { for (let yy = p.r; yy < p.r + p.h; yy++) grid[yy][x] = grid[y][x - 1]; p.w++; changed = true; continue; }
      }
      // 2) stretch the tile above downwards
      if (y > 0 && grid[y - 1][x] >= 0) {
        const p = placed[grid[y - 1][x]];
        if (p.r + p.h === y && rangeIsHole(y, y, p.c, p.c + p.w - 1)) { for (let xx = p.c; xx < p.c + p.w; xx++) grid[y][xx] = grid[y - 1][x]; p.h++; changed = true; continue; }
      }
      // 3) stretch the tile on the right to the left
      if (x < cols - 1 && grid[y][x + 1] >= 0) {
        const p = placed[grid[y][x + 1]];
        if (p.c === x + 1 && rangeIsHole(p.r, p.r + p.h - 1, x, x)) { for (let yy = p.r; yy < p.r + p.h; yy++) grid[yy][x] = grid[y][x + 1]; p.c--; p.w++; changed = true; continue; }
      }
    }
  }
  function rangeIsHole(r0, r1, c0, c1) { for (let y = r0; y <= r1; y++) for (let x = c0; x <= c1; x++) if (y >= rows || grid[y][x] !== -1) return false; return true; }

  // anything still empty becomes a decorative filler, merged along each row
  const fillers = [];
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    if (grid[y][x] !== -1) continue;
    let w = 1; while (x + w < cols && grid[y][x + w] === -1) w++;
    for (let k = 0; k < w; k++) grid[y][x + k] = -2;
    fillers.push({ r: y, c: x, w, h: 1 });
  }
  return { placed, fillers };
}

function columnsFor(width) {
  if (width < 520) return 2;
  if (width < 760) return 3;
  if (width < 1000) return 4;
  if (width < 1240) return 5;
  if (width < 1440) return 6;
  return 7;
}

function render() {
  const q = search.value.trim().toLowerCase();
  const list = tiles.filter(({ g }) => (filter === 'all' || g.tags.includes(filter)) && (!q || (g.name + ' ' + g.desc).toLowerCase().includes(q)));
  document.getElementById('count').textContent = list.length === GAMES.length ? GAMES.length : `${list.length} of ${GAMES.length}`;

  const width = gallery.clientWidth;
  const cols = columnsFor(width);
  const gutter = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gutter')) || 10;
  const cell = (width - gutter * (cols - 1)) / cols;
  gallery.style.setProperty('--cols', cols);
  gallery.style.setProperty('--row', Math.round(cell * 0.82) + 'px');

  gallery.replaceChildren();
  if (!list.length) { const e = document.createElement('p'); e.className = 'empty'; e.textContent = 'No games match that search.'; gallery.appendChild(e); return; }

  const { placed, fillers } = pack(list, cols);
  placed.forEach((p, i) => {
    const el = p.item.el;
    el.style.gridColumn = `${p.c + 1} / span ${p.w}`;
    el.style.gridRow = `${p.r + 1} / span ${p.h}`;
    el.style.setProperty('--i', i);
    gallery.appendChild(el);
  });
  for (const f of fillers) {
    const d = document.createElement('div');
    d.className = 'filler'; d.setAttribute('aria-hidden', 'true');
    d.style.gridColumn = `${f.c + 1} / span ${f.w}`; d.style.gridRow = `${f.r + 1} / span ${f.h}`;
    gallery.appendChild(d);
  }
}

// entrance animation on first load only, not on every re-pack
gallery.classList.add('intro');
setTimeout(() => gallery.classList.remove('intro'), 1600);

let lastCols = 0;
new ResizeObserver(() => {
  const cols = columnsFor(gallery.clientWidth);
  if (cols !== lastCols) { lastCols = cols; render(); }
  else { // same column count: only the row height changes
    const gutter = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gutter')) || 10;
    gallery.style.setProperty('--row', Math.round(((gallery.clientWidth - gutter * (cols - 1)) / cols) * 0.82) + 'px');
  }
}).observe(gallery);
</script>
</body>
</html>
